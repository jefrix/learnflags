<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas Project — Learn the Flags of the World</title>
<meta name="description" content="Learn the national flags of all 197 sovereign nations through flashcards, quizzes, and a world map placement game." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,300;1,9..144,600&family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4efe6;
  --bg-deep: #ebe3d3;
  --ink: #1a1612;
  --ink-soft: #5c554a;
  --accent: #c8462c;
  --accent-soft: #e88a72;
  --gold: #c89a3a;
  --line: #1a1612;
  --ocean: #d9d0bd;
  --grid: #b8ad97;
  --land: #1a1612;
  --correct: #3f7d4e;
  --wrong: #c8462c;
  --card: #fffbf3;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Inter Tight', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

#root { min-height: 100vh; }

.app-root {
  background:
    radial-gradient(ellipse at top left, rgba(200,154,58,0.08), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(200,70,44,0.06), transparent 50%),
    var(--bg);
  padding: 24px 16px;
  min-height: 100vh;
}

/* Loading screen while React boots */
.boot-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  background: var(--bg);
  z-index: 9999;
  transition: opacity 0.4s;
}
.boot-screen.hidden { opacity: 0; pointer-events: none; }
.boot-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 28px;
  color: var(--ink);
}
.boot-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--ink-soft);
  text-transform: uppercase;
}

/* ======= HOME ======= */
.home { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
.home-inner { position: relative; }
.title-block { margin-bottom: 56px; text-align: center; }
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--ink-soft);
  margin-bottom: 24px;
  text-transform: uppercase;
}
.title {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: clamp(48px, 9vw, 112px);
  line-height: 0.92;
  letter-spacing: -0.04em;
  color: var(--ink);
}
.title-line { display: block; }
.title-italic {
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
  padding-left: 0.4em;
}
.subtitle {
  margin-top: 28px;
  font-size: 17px;
  color: var(--ink-soft);
  max-width: 460px;
  margin-left: auto;
  margin-right: auto;
}
.mode-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
  margin-top: 40px;
}
.mode-card {
  background: var(--card);
  border: 1px solid var(--line);
  padding: 32px 28px;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  color: inherit;
  position: relative;
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s;
  overflow: hidden;
}
.mode-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent);
  transform: translateY(101%);
  transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
  z-index: 0;
}
.mode-card:hover { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--ink); }
.mode-card:hover::before { transform: translateY(0); }
.mode-card:hover .mode-num,
.mode-card:hover .mode-name,
.mode-card:hover .mode-desc,
.mode-card:hover .mode-arrow { color: var(--card); }
.mode-card > * { position: relative; z-index: 1; transition: color 0.3s; }
.mode-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 18px;
  letter-spacing: 0.1em;
}
.mode-name {
  font-family: 'Fraunces', serif;
  font-size: 30px;
  font-weight: 400;
  font-style: italic;
  margin-bottom: 12px;
  letter-spacing: -0.01em;
}
.mode-desc {
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.55;
  margin-bottom: 32px;
}
.mode-arrow { font-size: 24px; color: var(--ink); }
.footer-line {
  margin-top: 56px;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-soft);
  letter-spacing: 0.25em;
  text-transform: uppercase;
}

/* ======= MODE SCREENS ======= */
.mode-screen { max-width: 920px; margin: 0 auto; padding: 8px 12px 40px; }
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 4px 24px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}
.back-btn {
  background: none;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink);
  cursor: pointer;
  letter-spacing: 0.1em;
  padding: 6px 0;
}
.back-btn:hover { color: var(--accent); }
.topbar-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 22px;
  flex: 1;
  text-align: center;
}
.topbar-spacer { width: 60px; }

/* ======= FILTER ======= */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px dashed var(--grid);
}
.filter-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-right: 4px;
}
.chip {
  background: transparent;
  border: 1px solid var(--line);
  padding: 6px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  color: var(--ink);
  letter-spacing: 0.05em;
  transition: all 0.2s;
}
.chip:hover { background: var(--ink); color: var(--bg); }
.chip-active { background: var(--ink); color: var(--bg); }

/* ======= FLASHCARDS ======= */
.progress-row { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
.progress-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  white-space: nowrap;
}
.progress-bar {
  flex: 1;
  height: 4px;
  background: var(--bg-deep);
  border: 1px solid var(--line);
  overflow: hidden;
}
.progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
.card-stage { perspective: 1500px; margin: 20px auto 32px; max-width: 520px; }
.flashcard {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 2;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
  cursor: pointer;
}
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: 4px 4px 0 var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.flashcard-back { transform: rotateY(180deg); }
.flag-img {
  max-width: 85%;
  max-height: 75%;
  object-fit: contain;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.card-hint {
  position: absolute;
  bottom: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--ink-soft);
  text-transform: uppercase;
}
.card-region {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 16px;
}
.card-country {
  font-family: 'Fraunces', serif;
  font-size: clamp(28px, 6vw, 44px);
  font-weight: 400;
  font-style: italic;
  text-align: center;
  line-height: 1.05;
  letter-spacing: -0.02em;
}
.controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.controls-secondary { margin-top: 16px; text-align: center; }
.btn-primary, .btn-ghost {
  font-family: 'Inter Tight', sans-serif;
  font-size: 14px;
  padding: 12px 22px;
  border: 1px solid var(--line);
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: all 0.2s;
}
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: var(--ink); color: var(--bg); }
.link-btn {
  background: none;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  cursor: pointer;
  letter-spacing: 0.1em;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.link-btn:hover { color: var(--accent); }

/* ======= QUIZ ======= */
.score-row {
  display: flex;
  gap: 28px;
  align-items: flex-end;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.score-stat { text-align: left; }
.score-num {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 400;
  line-height: 1;
}
.score-num .unit { font-size: 14px; color: var(--ink-soft); margin-left: 2px; }
.score-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--ink-soft);
  text-transform: uppercase;
  margin-top: 4px;
}
.score-stat-accent .score-num { color: var(--accent); }
.quiz-stage { text-align: center; }
.quiz-flag-wrap {
  display: inline-block;
  margin: 12px 0 28px;
  padding: 8px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: 4px 4px 0 var(--ink);
}
.quiz-flag { display: block; max-width: 320px; width: 100%; height: auto; }
.quiz-prompt {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 22px;
  margin-bottom: 28px;
  color: var(--ink);
}
.quiz-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  max-width: 640px;
  margin: 0 auto;
}
.quiz-opt {
  background: var(--card);
  border: 1px solid var(--line);
  padding: 16px 20px;
  font-family: 'Inter Tight', sans-serif;
  font-size: 15px;
  cursor: pointer;
  color: var(--ink);
  transition: all 0.2s;
  text-align: left;
}
.quiz-opt:hover:not(:disabled) {
  background: var(--ink);
  color: var(--bg);
  transform: translate(-2px, -2px);
  box-shadow: 3px 3px 0 var(--ink);
}
.quiz-opt:disabled { cursor: default; }
.quiz-opt-correct { background: var(--correct) !important; color: var(--card) !important; border-color: var(--correct) !important; }
.quiz-opt-wrong { background: var(--wrong) !important; color: var(--card) !important; border-color: var(--wrong) !important; }
.quiz-opt-dim { opacity: 0.35; }

/* ======= MAP ======= */
.map-header {
  display: flex;
  gap: 20px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.map-prompt-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  padding: 10px 16px;
  box-shadow: 3px 3px 0 var(--ink);
}
.map-prompt-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.map-flag { width: 56px; height: auto; display: block; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
.map-prompt-name { font-family: 'Fraunces', serif; font-style: italic; font-size: 22px; }
.map-stats { display: flex; gap: 24px; align-items: flex-end; }
.map-wrap {
  border: 1px solid var(--line);
  background: var(--ocean);
  box-shadow: 4px 4px 0 var(--ink);
  margin-bottom: 18px;
  overflow: hidden;
}
.world-map { display: block; width: 100%; cursor: crosshair; }
.land-masses path { fill: var(--land); stroke: var(--land); stroke-width: 0.5; }
.map-result {
  padding: 14px 20px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.map-result-correct { background: var(--correct); color: var(--card); border-color: var(--correct); }
.map-result-wrong { background: var(--card); color: var(--ink); }
.map-result-msg { font-family: 'Fraunces', serif; font-style: italic; font-size: 18px; }
.map-result-dist {
  font-family: 'JetBrains Mono', monospace;
  font-style: normal;
  font-size: 13px;
  opacity: 0.85;
  margin-left: 8px;
}
.map-help {
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.1em;
}

@media (max-width: 600px) {
  .topbar-title { font-size: 18px; }
  .score-row { gap: 18px; }
  .score-num { font-size: 24px; }
  .map-prompt-name { font-size: 18px; }
  .map-flag { width: 44px; }
  .map-header { gap: 12px; }
}
</style>
</head>

const flagUrl = (code) => `https://flagcdn.com/w640/${code.toLowerCase()}.png`;
const flagUrlSmall = (code) => `https://flagcdn.com/w160/${code.toLowerCase()}.png`;

const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const project = (lat, lng) => {
  const x = (lng + 180) * (1000 / 360);
  const y = (90 - lat) * (500 / 180);
  return { x, y };
};

function Flashcards({ onHome, region, setRegion }) {
  const pool = useMemo(() =>
    region === "All" ? COUNTRIES : COUNTRIES.filter(c => c.region === region),
    [region]
  );
  const [deck, setDeck] = useState(() => shuffle(pool));
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(new Set());

  useEffect(() => {
    setDeck(shuffle(pool));
    setIdx(0);
    setFlipped(false);
    setKnown(new Set());
  }, [pool]);

  const current = deck[idx];
  const progress = ((idx + 1) / deck.length) * 100;

  const next = () => {
    setFlipped(false);
    setTimeout(() => setIdx((i) => (i + 1) % deck.length), 150);
  };
  const prev = () => {
    setFlipped(false);
    setTimeout(() => setIdx((i) => (i - 1 + deck.length) % deck.length), 150);
  };
  const markKnown = () => {
    setKnown((s) => new Set(s).add(current.code));
    next();
  };
  const reshuffle = () => {
    setDeck(shuffle(pool));
    setIdx(0);
    setFlipped(false);
  };

  if (!current) return null;

  return (
    <div className="mode-screen">
      <TopBar onHome={onHome} title="Flashcards" />

      <div className="filter-bar">
        <span className="filter-label">Region:</span>
        {REGIONS.map(r => (
          <button
            key={r}
            className={`chip ${region === r ? 'chip-active' : ''}`}
            onClick={() => setRegion(r)}
          >{r}</button>
        ))}
      </div>

      <div className="progress-row">
        <div className="progress-text">{idx + 1} / {deck.length}</div>
        <div className="progress-bar"><div className="progress-fill" style={{ width: `${progress}%` }} /></div>
        <div className="progress-text">{known.size} learned</div>
      </div>

      <div className="card-stage">
        <div
          className={`flashcard ${flipped ? 'flipped' : ''}`}
          onClick={() => setFlipped(f => !f)}
        >
          <div className="flashcard-face flashcard-front">
            <img src={flagUrl(current.code)} alt="flag" className="flag-img" />
            <div className="card-hint">tap to reveal</div>
          </div>
          <div className="flashcard-face flashcard-back">
            <div className="card-region">{current.region}</div>
            <div className="card-country">{current.name}</div>
            <div className="card-hint">tap to flip back</div>
          </div>
        </div>
      </div>

      <div className="controls">
        <button className="btn-ghost" onClick={prev}>← Prev</button>
        <button className="btn-primary" onClick={markKnown}>✓ I knew it</button>
        <button className="btn-ghost" onClick={next}>Next →</button>
      </div>
      <div className="controls-secondary">
        <button className="link-btn" onClick={reshuffle}>↻ Reshuffle deck</button>
      </div>
    </div>
  );
}

function Quiz({ onHome, region, setRegion }) {
  const pool = useMemo(() =>
    region === "All" ? COUNTRIES : COUNTRIES.filter(c => c.region === region),
    [region]
  );

  const [question, setQuestion] = useState(null);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [best, setBest] = useState(0);
  const [total, setTotal] = useState(0);

  const generate = () => {
    const correct = pool[Math.floor(Math.random() * pool.length)];
    const wrongPool = pool.filter(c => c.code !== correct.code);
    const wrongs = shuffle(wrongPool).slice(0, 3);
    const options = shuffle([correct, ...wrongs]);
    setQuestion({ correct, options });
    setPicked(null);
  };

  useEffect(() => { generate(); }, [pool]);

  const pick = (opt) => {
    if (picked) return;
    setPicked(opt);
    setTotal(t => t + 1);
    if (opt.code === question.correct.code) {
      setScore(s => s + 1);
      setStreak(s => {
        const ns = s + 1;
        setBest(b => Math.max(b, ns));
        return ns;
      });
    } else {
      setStreak(0);
    }
    setTimeout(generate, 1100);
  };

  const reset = () => { setScore(0); setStreak(0); setBest(0); setTotal(0); generate(); };

  if (!question) return null;

  return (
    <div className="mode-screen">
      <TopBar onHome={onHome} title="Quick Quiz" />

      <div className="filter-bar">
        <span className="filter-label">Region:</span>
        {REGIONS.map(r => (
          <button
            key={r}
            className={`chip ${region === r ? 'chip-active' : ''}`}
            onClick={() => setRegion(r)}
          >{r}</button>
        ))}
      </div>

      <div className="score-row">
        <div className="score-stat">
          <div className="score-num">{score}/{total}</div>
          <div className="score-lbl">score</div>
        </div>
        <div className="score-stat score-stat-accent">
          <div className="score-num">🔥 {streak}</div>
          <div className="score-lbl">streak</div>
        </div>
        <div className="score-stat">
          <div className="score-num">{best}</div>
          <div className="score-lbl">best</div>
        </div>
        <button className="link-btn" onClick={reset}>reset</button>
      </div>

      <div className="quiz-stage">
        <div className="quiz-flag-wrap">
          <img src={flagUrl(question.correct.code)} alt="flag" className="quiz-flag" />
        </div>
        <div className="quiz-prompt">Which nation does this flag belong to?</div>
        <div className="quiz-options">
          {question.options.map(opt => {
            let cls = "quiz-opt";
            if (picked) {
              if (opt.code === question.correct.code) cls += " quiz-opt-correct";
              else if (opt.code === picked.code) cls += " quiz-opt-wrong";
              else cls += " quiz-opt-dim";
            }
            return (
              <button
                key={opt.code}
                className={cls}
                onClick={() => pick(opt)}
                disabled={!!picked}
              >
                {opt.name}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function MapMode({ onHome, region, setRegion }) {
  const pool = useMemo(() =>
    region === "All" ? COUNTRIES : COUNTRIES.filter(c => c.region === region),
    [region]
  );

  const [target, setTarget] = useState(null);
  const [result, setResult] = useState(null);
  const [score, setScore] = useState(0);
  const [rounds, setRounds] = useState(0);
  const [totalDist, setTotalDist] = useState(0);
  const svgRef = useRef(null);

  const newRound = () => {
    const t = pool[Math.floor(Math.random() * pool.length)];
    setTarget(t);
    setResult(null);
  };

  useEffect(() => { newRound(); }, [pool]);

  const handleMapClick = (e) => {
    if (result || !target) return;
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    const cursor = pt.matrixTransform(svg.getScreenCTM().inverse());

    const targetPt = project(target.lat, target.lng);
    const dx = cursor.x - targetPt.x;
    const dy = cursor.y - targetPt.y;
    const distSvg = Math.sqrt(dx * dx + dy * dy);
    const distKm = Math.round(distSvg * 40);
    const correct = distSvg < 35;

    setResult({ distance: distKm, distSvg, correct, clickedPos: { x: cursor.x, y: cursor.y }, targetPos: targetPt });
    setRounds(r => r + 1);
    setTotalDist(d => d + distKm);
    if (correct) setScore(s => s + 1);
  };

  const avgDist = rounds > 0 ? Math.round(totalDist / rounds) : 0;
  const reset = () => { setScore(0); setRounds(0); setTotalDist(0); newRound(); };

  if (!target) return null;

  return (
    <div className="mode-screen">
      <TopBar onHome={onHome} title="World Map" />

      <div className="filter-bar">
        <span className="filter-label">Region:</span>
        {REGIONS.map(r => (
          <button
            key={r}
            className={`chip ${region === r ? 'chip-active' : ''}`}
            onClick={() => setRegion(r)}
          >{r}</button>
        ))}
      </div>

      <div className="map-header">
        <div className="map-prompt-card">
          <div className="map-prompt-lbl">Place this flag:</div>
          <img src={flagUrlSmall(target.code)} alt="flag" className="map-flag" />
          <div className="map-prompt-name">{target.name}</div>
        </div>
        <div className="map-stats">
          <div className="score-stat">
            <div className="score-num">{score}/{rounds}</div>
            <div className="score-lbl">hits</div>
          </div>
          <div className="score-stat">
            <div className="score-num">{avgDist}<span className="unit">km</span></div>
            <div className="score-lbl">avg miss</div>
          </div>
          <button className="link-btn" onClick={reset}>reset</button>
        </div>
      </div>

      <div className="map-wrap">
        <svg
          ref={svgRef}
          viewBox="0 0 1000 500"
          className="world-map"
          onClick={handleMapClick}
          preserveAspectRatio="xMidYMid meet"
        >
          <rect width="1000" height="500" fill="var(--ocean)" />

          <g className="grid-lines">
            {[100, 200, 250, 300, 400].map(y => (
              <line key={y} x1="0" y1={y} x2="1000" y2={y} stroke="var(--grid)" strokeWidth="0.3" />
            ))}
            {[200, 400, 500, 600, 800].map(x => (
              <line key={x} x1={x} y1="0" x2={x} y2="500" stroke="var(--grid)" strokeWidth="0.3" />
            ))}
          </g>

          <g className="land-masses">
            <path d="M 130,90 L 180,75 L 250,85 L 290,110 L 280,150 L 250,175 L 240,210 L 200,225 L 175,215 L 155,180 L 140,160 L 120,140 L 115,110 Z" />
            <path d="M 200,225 L 230,235 L 245,255 L 240,275 L 220,270 L 205,250 Z" />
            <path d="M 260,285 L 295,275 L 320,290 L 335,320 L 330,360 L 315,395 L 295,415 L 275,400 L 270,360 L 265,320 Z" />
            <path d="M 380,60 L 420,55 L 435,80 L 420,105 L 390,100 Z" />
            <path d="M 460,110 L 510,100 L 545,115 L 555,140 L 530,160 L 495,165 L 470,150 L 458,130 Z" />
            <path d="M 490,180 L 530,175 L 565,195 L 580,230 L 580,275 L 560,315 L 535,335 L 510,325 L 495,290 L 485,250 L 488,215 Z" />
            <path d="M 555,165 L 590,170 L 610,195 L 600,215 L 580,210 L 565,190 Z" />
            <path d="M 555,90 L 650,75 L 760,80 L 830,90 L 870,105 L 870,135 L 820,145 L 760,140 L 680,135 L 600,130 L 565,120 Z" />
            <path d="M 700,150 L 770,145 L 810,160 L 825,185 L 800,205 L 770,210 L 735,200 L 710,180 Z" />
            <path d="M 680,200 L 720,205 L 730,235 L 715,255 L 695,250 L 685,225 Z" />
            <path d="M 770,225 L 810,225 L 825,250 L 815,275 L 790,275 L 775,255 Z" />
            <path d="M 800,285 L 850,280 L 880,295 L 860,310 L 820,308 Z" />
            <path d="M 855,250 L 875,250 L 880,270 L 860,272 Z" />
            <path d="M 855,170 L 870,165 L 880,185 L 870,200 L 858,190 Z" />
            <path d="M 815,355 L 880,350 L 910,370 L 905,395 L 870,405 L 830,400 L 815,380 Z" />
            <path d="M 935,395 L 950,395 L 955,415 L 940,420 Z" />
            <path d="M 50,470 L 950,470 L 950,495 L 50,495 Z" />
            <path d="M 458,115 L 475,113 L 478,135 L 462,138 Z" />
            <path d="M 590,295 L 600,290 L 605,315 L 595,320 Z" />
          </g>

          {result && (
            <React.Fragment>
              <circle cx={result.targetPos.x} cy={result.targetPos.y} r="8" fill="var(--correct)" opacity="0.3">
                <animate attributeName="r" from="8" to="20" dur="1s" repeatCount="indefinite" />
                <animate attributeName="opacity" from="0.5" to="0" dur="1s" repeatCount="indefinite" />
              </circle>
              <circle cx={result.targetPos.x} cy={result.targetPos.y} r="4" fill="var(--correct)" />
              <line
                x1={result.clickedPos.x}
                y1={result.clickedPos.y}
                x2={result.targetPos.x}
                y2={result.targetPos.y}
                stroke={result.correct ? "var(--correct)" : "var(--wrong)"}
                strokeWidth="1.2"
                strokeDasharray="3 3"
              />
              <circle
                cx={result.clickedPos.x}
                cy={result.clickedPos.y}
                r="3"
                fill={result.correct ? "var(--correct)" : "var(--wrong)"}
              />
            </React.Fragment>
          )}
        </svg>
      </div>

      {result && (
        <div className={`map-result ${result.correct ? 'map-result-correct' : 'map-result-wrong'}`}>
          <div className="map-result-msg">
            {result.correct ? '✓ Right on it!' : '✗ Missed.'} <span className="map-result-dist">{result.distance.toLocaleString()} km off</span>
          </div>
          <button className="btn-primary" onClick={newRound}>Next flag →</button>
        </div>
      )}

      <div className="map-help">Click anywhere on the map to place the flag.</div>
    </div>
  );
}

function TopBar({ onHome, title }) {
  return (
    <div className="topbar">
      <button className="back-btn" onClick={onHome}>← Atlas</button>
      <div className="topbar-title">{title}</div>
      <div className="topbar-spacer" />
    </div>
  );
}

function App() {
  const [mode, setMode] = useState('home');
  const [region, setRegion] = useState('All');

  useEffect(() => {
    const boot = document.getElementById('boot');
    if (boot) {
      boot.classList.add('hidden');
      setTimeout(() => boot.remove(), 500);
    }
  }, []);

  return (
    <div className="app-root">
      {mode === 'home' && <Home onPick={setMode} />}
      {mode === 'flashcard' && <Flashcards onHome={() => setMode('home')} region={region} setRegion={setRegion} />}
      {mode === 'quiz' && <Quiz onHome={() => setMode('home')} region={region} setRegion={setRegion} />}
      {mode === 'map' && <MapMode onHome={() => setMode('home')} region={region} setRegion={setRegion} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>

function Flashcards({ onHome, region, setRegion }) {
  const pool = useMemo(() =>
    region === "All" ? COUNTRIES : COUNTRIES.filter(c => c.region === region),
    [region]
  );
  const [deck, setDeck] = useState(() => shuffle(pool));
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(new Set());

  useEffect(() => {
    setDeck(shuffle(pool));
    setIdx(0);
    setFlipped(false);
    setKnown(new Set());
  }, [pool]);

  const current = deck[idx];
  const progress = ((idx + 1) / deck.length) * 100;

  const next = () => {
    setFlipped(false);
    setTimeout(() => setIdx((i) => (i + 1) % deck.length), 150);
  };
  const prev = () => {
    setFlipped(false);
    setTimeout(() => setIdx((i) => (i - 1 + deck.length) % deck.length), 150);
  };
  const markKnown = () => {
    setKnown((s) => new Set(s).add(current.code));
    next();
  };
  const reshuffle = () => {
    setDeck(shuffle(pool));
    setIdx(0);
    setFlipped(false);
  };

  if (!current) return null;

  return (
    <div className="mode-screen">
      <TopBar onHome={onHome} title="Flashcards" />

      <div className="filter-bar">
        <span className="filter-label">Region:</span>
        {REGIONS.map(r => (
          <button
            key={r}
            className={`chip ${region === r ? 'chip-active' : ''}`}
            onClick={() => setRegion(r)}
          >{r}</button>
        ))}
      </div>

      <div className="progress-row">
        <div className="progress-text">{idx + 1} / {deck.length}</div>
        <div className="progress-bar"><div className="progress-fill" style={{ width: `${progress}%` }} /></div>
        <div className="progress-text">{known.size} learned</div>
      </div>

      <div className={`card-layout ${flipped ? '' : 'no-info'}`}>
        <div className="card-stage">
          <div
            className={`flashcard ${flipped ? 'flipped' : ''}`}
            onClick={() => setFlipped(f => !f)}
          >
            <div className="flashcard-face flashcard-front">
              <img src={flagUrl(current.code)} alt="flag" className="flag-img" />
              <div className="card-hint">tap to reveal</div>
            </div>
            <div className="flashcard-face flashcard-back">
              <div className="card-region">{current.region}</div>
              <div className="card-country">{current.name}</div>
              {COUNTRY_INFO[current.code] && (
                <div className="card-endonym">({COUNTRY_INFO[current.code].endonym})</div>
              )}
              <div className="card-hint">tap to flip back</div>
            </div>
          </div>
        </div>
        <div className={`info-panel ${flipped ? 'visible' : ''}`}>
          <div className="info-panel-label">About the flag</div>
          <div className="info-panel-text">
            {COUNTRY_INFO[current.code]
              ? COUNTRY_INFO[current.code].info
              : `Information about the flag of ${current.name} is not available yet.`}
          </div>
        </div>
      </div>

      <div className="controls">
        <button className="btn-ghost" onClick={prev}>← Prev</button>
        <button className="btn-primary" onClick={markKnown}>✓ I knew it</button>
        <button className="btn-ghost" onClick={next}>Next →</button>
      </div>
      <div className="controls-secondary">
        <button className="link-btn" onClick={reshuffle}>↻ Reshuffle deck</button>
      </div>
    </div>
  );
}

function Quiz({ onHome, region, setRegion }) {
  const pool = useMemo(() =>
    region === "All" ? COUNTRIES : COUNTRIES.filter(c => c.region === region),
    [region]
  );

  const [question, setQuestion] = useState(null);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [best, setBest] = useState(0);
  const [total, setTotal] = useState(0);

  const generate = () => {
    const correct = pool[Math.floor(Math.random() * pool.length)];
    const wrongPool = pool.filter(c => c.code !== correct.code);
    const wrongs = shuffle(wrongPool).slice(0, 3);
    const options = shuffle([correct, ...wrongs]);
    setQuestion({ correct, options });
    setPicked(null);
  };

  useEffect(() => { generate(); }, [pool]);

  const pick = (opt) => {
    if (picked) return;
    setPicked(opt);
    setTotal(t => t + 1);
    if (opt.code === question.correct.code) {
      setScore(s => s + 1);
      setStreak(s => {
        const ns = s + 1;
        setBest(b => Math.max(b, ns));
        return ns;
      });
    } else {
      setStreak(0);
    }
    setTimeout(generate, 1100);
  };

  const reset = () => { setScore(0); setStreak(0); setBest(0); setTotal(0); generate(); };

  if (!question) return null;

  return (
    <div className="mode-screen">
      <TopBar onHome={onHome} title="Quick Quiz" />

      <div className="filter-bar">
        <span className="filter-label">Region:</span>
        {REGIONS.map(r => (
          <button
            key={r}
            className={`chip ${region === r ? 'chip-active' : ''}`}
            onClick={() => setRegion(r)}
          >{r}</button>
        ))}
      </div>

      <div className="score-row">
        <div className="score-stat">
          <div className="score-num">{score}/{total}</div>
          <div className="score-lbl">score</div>
        </div>
        <div className="score-stat score-stat-accent">
          <div className="score-num">🔥 {streak}</div>
          <div className="score-lbl">streak</div>
        </div>
        <div className="score-stat">
          <div className="score-num">{best}</div>
          <div className="score-lbl">best</div>
        </div>
        <button className="link-btn" onClick={reset}>reset</button>
      </div>

      <div className="quiz-stage">
        <div className="quiz-flag-wrap">
          <img src={flagUrl(question.correct.code)} alt="flag" className="quiz-flag" />
        </div>
        <div className="quiz-prompt">Which nation does this flag belong to?</div>
        <div className="quiz-options">
          {question.options.map(opt => {
            let cls = "quiz-opt";
            if (picked) {
              if (opt.code === question.correct.code) cls += " quiz-opt-correct";
              else if (opt.code === picked.code) cls += " quiz-opt-wrong";
              else cls += " quiz-opt-dim";
            }
            return (
              <button
                key={opt.code}
                className={cls}
                onClick={() => pick(opt)}
                disabled={!!picked}
              >
                {opt.name}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function MapMode({ onHome, region, setRegion }) {
  const pool = useMemo(() =>
    region === "All" ? COUNTRIES : COUNTRIES.filter(c => c.region === region),
    [region]
  );

  const [target, setTarget] = useState(null);
  const [result, setResult] = useState(null);
  const [score, setScore] = useState(0);
  const [rounds, setRounds] = useState(0);
  const [totalDist, setTotalDist] = useState(0);

  // Zoom + pan state — viewBox: [x, y, w, h]
  // Continent bounding boxes in SVG coords (1000x500 equirectangular)
  // Format: [x, y, width, height]
  const VIEW_PRESETS = {
    All: [0, 0, 1000, 500],
    Africa: [430, 175, 220, 200],
    Americas: [120, 60, 280, 380],
    Asia: [560, 70, 360, 270],
    Europe: [430, 70, 200, 130],
    Oceania: [760, 280, 220, 170],
  };
  const [viewBox, setViewBox] = useState(VIEW_PRESETS.All);
  const svgRef = useRef(null);
  const pathRefs = useRef({});

  // When user changes region via filter chips, also zoom to that continent
  const handleRegionChange = (r) => {
    setRegion(r);
    if (VIEW_PRESETS[r]) {
      setViewBox(VIEW_PRESETS[r]);
    }
  };

  const newRound = () => {
    const t = pool[Math.floor(Math.random() * pool.length)];
    setTarget(t);
    setResult(null);
  };

  useEffect(() => { newRound(); }, [pool]);

  // Convert client coords to SVG coords (respects viewBox)
  const clientToSvg = (clientX, clientY) => {
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };

  const hitTest = (svgX, svgY) => {
    const svg = svgRef.current;
    if (!svg) return null;
    const pt = svg.createSVGPoint();
    pt.x = svgX; pt.y = svgY;
    for (const code in pathRefs.current) {
      const el = pathRefs.current[code];
      if (el && el.isPointInFill && el.isPointInFill(pt)) return code;
    }
    return null;
  };

  // Distinguish click from drag
  const dragState = useRef({ isDragging: false, startX: 0, startY: 0, hasMoved: false });

  const handleMouseDown = (e) => {
    dragState.current = { isDragging: true, startX: e.clientX, startY: e.clientY, hasMoved: false };
  };

  const handleMouseMove = (e) => {
    if (!dragState.current.isDragging) return;
    const dx = e.clientX - dragState.current.startX;
    const dy = e.clientY - dragState.current.startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      dragState.current.hasMoved = true;
    }
    if (!dragState.current.hasMoved) return;
    // Pan: convert pixel delta to SVG units
    const svg = svgRef.current;
    const rect = svg.getBoundingClientRect();
    const svgDx = (dx / rect.width) * viewBox[2];
    const svgDy = (dy / rect.height) * viewBox[3];
    dragState.current.startX = e.clientX;
    dragState.current.startY = e.clientY;
    setViewBox(prev => {
      const nx = Math.max(0, Math.min(1000 - prev[2], prev[0] - svgDx));
      const ny = Math.max(0, Math.min(500 - prev[3], prev[1] - svgDy));
      return [nx, ny, prev[2], prev[3]];
    });
  };

  const handleMouseUp = (e) => {
    const wasDrag = dragState.current.hasMoved;
    dragState.current.isDragging = false;
    if (wasDrag) return; // it was a pan, not a click
    handleMapClick(e);
  };

  const handleMouseLeave = () => {
    dragState.current.isDragging = false;
  };

  const handleWheel = (e) => {
    e.preventDefault();
    const svg = svgRef.current;
    if (!svg) return;
    const cursor = clientToSvg(e.clientX, e.clientY);
    // Negative delta = zoom in
    const factor = e.deltaY < 0 ? 0.8 : 1.25;
    setViewBox(prev => zoomViewBox(prev, factor, cursor.x, cursor.y));
  };

  const zoomViewBox = (vb, factor, cx, cy) => {
    let [x, y, w, h] = vb;
    let newW = Math.max(40, Math.min(1000, w * factor));
    let newH = Math.max(20, Math.min(500, h * factor));
    // Preserve aspect to map's natural 2:1
    if (newW / newH > 2) newH = newW / 2;
    else newW = newH * 2;
    // Keep cursor point stable
    let newX = cx - (cx - x) * (newW / w);
    let newY = cy - (cy - y) * (newH / h);
    // Clamp to map bounds
    newX = Math.max(0, Math.min(1000 - newW, newX));
    newY = Math.max(0, Math.min(500 - newH, newY));
    return [newX, newY, newW, newH];
  };

  const zoomIn = () => {
    const cx = viewBox[0] + viewBox[2] / 2;
    const cy = viewBox[1] + viewBox[3] / 2;
    setViewBox(prev => zoomViewBox(prev, 0.7, cx, cy));
  };
  const zoomOut = () => {
    const cx = viewBox[0] + viewBox[2] / 2;
    const cy = viewBox[1] + viewBox[3] / 2;
    setViewBox(prev => zoomViewBox(prev, 1.4, cx, cy));
  };
  const zoomReset = () => setViewBox(VIEW_PRESETS.All);

  const handleMapClick = (e) => {
    if (result || !target) return;
    const cursor = clientToSvg(e.clientX, e.clientY);

    // Dot tap radius scales with viewBox size so it stays ~12 screen pixels
    // regardless of zoom level. (viewBox width / 1000) gives us SVG-units-per-screen-px ratio.
    const svgUnitsPerPixel = viewBox[2] / 1000;  // approximate
    const dotTapRadius = 14 * svgUnitsPerPixel;

    // PRIORITY 1: Check microstate dots first. They're tiny visual targets that the user
    // is specifically aiming at, so they should win even if the cursor is also over a
    // neighboring country's polygon (e.g., Monaco vs France, Vatican vs Italy).
    let clickedCode = null;
    let bestDotDist = dotTapRadius;
    for (const c of COUNTRIES) {
      if (HAS_BORDER.has(c.code)) continue;
      const p = project(c.lat, c.lng);
      const d = Math.hypot(p.x - cursor.x, p.y - cursor.y);
      if (d < bestDotDist) { bestDotDist = d; clickedCode = c.code; }
    }

    // PRIORITY 2: If no dot was tapped, fall back to country polygon hit-testing.
    if (!clickedCode) {
      clickedCode = hitTest(cursor.x, cursor.y);
    }

    const correct = clickedCode === target.code;
    let distKm = 0;
    if (!correct) {
      let clickedCenter;
      if (clickedCode) {
        const cc = COUNTRIES.find(c => c.code === clickedCode);
        clickedCenter = cc ? project(cc.lat, cc.lng) : { x: cursor.x, y: cursor.y };
      } else {
        clickedCenter = { x: cursor.x, y: cursor.y };
      }
      const targetCenter = project(target.lat, target.lng);
      const distSvg = Math.hypot(clickedCenter.x - targetCenter.x, clickedCenter.y - targetCenter.y);
      distKm = Math.round(distSvg * (40000 / 1000));
    }

    const clickedCountry = clickedCode ? COUNTRIES.find(c => c.code === clickedCode) : null;
    setResult({
      correct,
      clickedCode,
      clickedName: clickedCountry ? clickedCountry.name : null,
      distKm,
      clickedPos: { x: cursor.x, y: cursor.y },
    });
    setRounds(r => r + 1);
    setTotalDist(d => d + distKm);
    if (correct) setScore(s => s + 1);

    // If the target is currently off-screen, ease the view to it after answering
    const tp = project(target.lat, target.lng);
    const offscreen = tp.x < viewBox[0] || tp.x > viewBox[0] + viewBox[2] ||
                      tp.y < viewBox[1] || tp.y > viewBox[1] + viewBox[3];
    if (offscreen) {
      // Center view on target while preserving zoom level
      setViewBox(prev => {
        const newX = Math.max(0, Math.min(1000 - prev[2], tp.x - prev[2] / 2));
        const newY = Math.max(0, Math.min(500 - prev[3], tp.y - prev[3] / 2));
        return [newX, newY, prev[2], prev[3]];
      });
    }
  };

  const avgDist = rounds > 0 ? Math.round(totalDist / rounds) : 0;
  const reset = () => { setScore(0); setRounds(0); setTotalDist(0); newRound(); };

  // Attach wheel listener with passive: false so preventDefault works
  useEffect(() => {
    const svg = svgRef.current;
    if (!svg) return;
    const wheelHandler = (e) => handleWheel(e);
    svg.addEventListener('wheel', wheelHandler, { passive: false });
    return () => svg.removeEventListener('wheel', wheelHandler);
    // eslint-disable-next-line
  }, [viewBox]);

  if (!target) return null;

  const targetPos = project(target.lat, target.lng);
  const zoomPercent = Math.round(1000 / viewBox[2] * 100);
  // Marker sizes are in SVG units. With vector-effect: non-scaling-stroke on land paths
  // and country-dot, stroke widths stay constant on screen. We DO want dots and result
  // markers to scale inversely with zoom so they stay roughly the same screen size.
  const svgUnitsPerPixel = viewBox[2] / 1000;
  const dotRadius = 3 * svgUnitsPerPixel;   // ~3 screen pixels regardless of zoom
  const targetMarkerR = 6 * svgUnitsPerPixel;
  const targetMarkerStroke = 1.5 * svgUnitsPerPixel;

  return (
    <div className="mode-screen">
      <TopBar onHome={onHome} title="World Map" />

      <div className="filter-bar">
        <span className="filter-label">Zoom to:</span>
        {REGIONS.map(r => (
          <button
            key={r}
            className={`chip ${region === r ? 'chip-active' : ''}`}
            onClick={() => handleRegionChange(r)}
          >{r}</button>
        ))}
      </div>

      <div className="map-header">
        <div className="map-prompt-card">
          <div className="map-prompt-lbl">Place this flag:</div>
          <img src={flagUrlSmall(target.code)} alt="flag" className="map-flag" />
          <div className="map-prompt-name">{target.name}</div>
        </div>
        <div className="map-stats">
          <div className="score-stat">
            <div className="score-num">{score}/{rounds}</div>
            <div className="score-lbl">hits</div>
          </div>
          <div className="score-stat">
            <div className="score-num">{avgDist}<span className="unit">km</span></div>
            <div className="score-lbl">avg miss</div>
          </div>
          <button className="link-btn" onClick={reset}>reset</button>
        </div>
      </div>

      <div className="map-wrap">
        <div className="zoom-controls">
          <button className="zoom-btn" onClick={zoomIn} title="Zoom in">+</button>
          <button className="zoom-btn" onClick={zoomOut} title="Zoom out">−</button>
          <button className="zoom-btn" onClick={zoomReset} title="Reset view" style={{fontSize:'12px'}}>⌖</button>
          <div className="zoom-indicator">{zoomPercent}%</div>
        </div>
        <svg
          ref={svgRef}
          viewBox={viewBox.join(' ')}
          className="world-map"
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onMouseLeave={handleMouseLeave}
          preserveAspectRatio="xMidYMid meet"
          style={{ transition: dragState.current.isDragging ? 'none' : 'all 0.4s ease' }}
        >
          <rect x="0" y="0" width="1000" height="500" fill="var(--ocean)" />

          <g className="grid-lines">
            {[125, 250, 375].map(y => (
              <line key={y} x1="0" y1={y} x2="1000" y2={y} stroke="var(--grid)" strokeWidth="0.5" strokeDasharray="2 4" vectorEffect="non-scaling-stroke" />
            ))}
            {[250, 500, 750].map(x => (
              <line key={x} x1={x} y1="0" x2={x} y2="500" stroke="var(--grid)" strokeWidth="0.5" strokeDasharray="2 4" vectorEffect="non-scaling-stroke" />
            ))}
          </g>

          <g className="land-masses">
            {Object.entries(COUNTRY_PATHS).map(([code, d]) => {
              let cls = result ? '' : 'hover-hint';
              if (result) {
                if (code === target.code) cls = 'target-flash';
                else if (!result.correct && code === result.clickedCode) cls = 'clicked-wrong';
              }
              return (
                <path
                  key={code}
                  ref={el => { if (el) pathRefs.current[code] = el; }}
                  d={d}
                  className={cls}
                  data-code={code}
                />
              );
            })}
          </g>

          <g className="island-dots">
            {COUNTRIES.filter(c => !HAS_BORDER.has(c.code)).map(c => {
              const p = project(c.lat, c.lng);
              let cls = 'country-dot';
              if (result) {
                if (c.code === target.code) cls += ' target-flash';
                else if (!result.correct && c.code === result.clickedCode) cls += ' clicked-wrong';
              }
              const isTarget = c.code === target.code && result;
              return (
                <circle
                  key={c.code}
                  cx={p.x}
                  cy={p.y}
                  r={isTarget ? dotRadius * 1.8 : dotRadius}
                  className={cls}
                  data-code={c.code}
                />
              );
            })}
          </g>

          {result && (
            <React.Fragment>
              <circle cx={targetPos.x} cy={targetPos.y} r={targetMarkerR} fill="none" stroke="var(--gold)" strokeWidth={targetMarkerStroke}>
                <animate attributeName="r" from={targetMarkerR * 0.6} to={targetMarkerR * 4} dur="1.4s" repeatCount="indefinite" />
                <animate attributeName="opacity" from="1" to="0" dur="1.4s" repeatCount="indefinite" />
              </circle>
              {!result.correct && (
                <line
                  x1={result.clickedPos.x}
                  y1={result.clickedPos.y}
                  x2={targetPos.x}
                  y2={targetPos.y}
                  stroke="var(--wrong)"
                  strokeWidth="1.5"
                  strokeDasharray="4 4"
                  opacity="0.75"
                  vectorEffect="non-scaling-stroke"
                />
              )}
            </React.Fragment>
          )}
        </svg>
      </div>

      {result && (
        <div className={`map-result ${result.correct ? 'map-result-correct' : 'map-result-wrong'}`}>
          <div className="map-result-msg">
            {result.correct
              ? <span>✓ Correct — that's {target.name}.</span>
              : result.clickedName
                ? <span>✗ That was {result.clickedName}. <span className="map-result-dist">{result.distKm.toLocaleString()} km off</span></span>
                : <span>✗ You clicked the ocean. The target was {target.name}.</span>
            }
          </div>
          <button className="btn-primary" onClick={newRound}>Next flag →</button>
        </div>
      )}

      <div className="map-help">Click a country to guess · scroll to zoom · drag to pan · use buttons above to jump to a continent</div>
    </div>
  );
}

function TopBar({ onHome, title }) {
  return (
    <div className="topbar">
      <button className="back-btn" onClick={onHome}>← Atlas</button>
      <div className="topbar-title">{title}</div>
      <div className="topbar-spacer" />
    </div>
  );
}

function App() {
  const [mode, setMode] = useState('home');
  const [region, setRegion] = useState('All');

  useEffect(() => {
    const boot = document.getElementById('boot');
    if (boot) {
      boot.classList.add('hidden');
      setTimeout(() => boot.remove(), 500);
    }
  }, []);

  return (
    <div className="app-root">
      {mode === 'home' && <Home onPick={setMode} />}
      {mode === 'flashcard' && <Flashcards onHome={() => setMode('home')} region={region} setRegion={setRegion} />}
      {mode === 'quiz' && <Quiz onHome={() => setMode('home')} region={region} setRegion={setRegion} />}
      {mode === 'map' && <MapMode onHome={() => setMode('home')} region={region} setRegion={setRegion} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>

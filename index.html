<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas Project — Learn the Flags of the World</title>
<meta name="description" content="Learn the national flags of all 197 sovereign nations through flashcards, quizzes, and a world map placement game." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,300;1,9..144,600&family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4efe6;
  --bg-deep: #ebe3d3;
  --ink: #1a1612;
  --ink-soft: #5c554a;
  --accent: #c8462c;
  --accent-soft: #e88a72;
  --gold: #c89a3a;
  --line: #1a1612;
  --ocean: #d9d0bd;
  --grid: #b8ad97;
  --land: #1a1612;
  --correct: #3f7d4e;
  --wrong: #c8462c;
  --card: #fffbf3;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Inter Tight', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

#root { min-height: 100vh; }

.app-root {
  background:
    radial-gradient(ellipse at top left, rgba(200,154,58,0.08), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(200,70,44,0.06), transparent 50%),
    var(--bg);
  padding: 24px 16px;
  min-height: 100vh;
}

/* Loading screen while React boots */
.boot-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  background: var(--bg);
  z-index: 9999;
  transition: opacity 0.4s;
}
.boot-screen.hidden { opacity: 0; pointer-events: none; }
.boot-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 28px;
  color: var(--ink);
}
.boot-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--ink-soft);
  text-transform: uppercase;
}

/* ======= HOME ======= */
.home { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
.home-inner { position: relative; }
.title-block { margin-bottom: 56px; text-align: center; }
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--ink-soft);
  margin-bottom: 24px;
  text-transform: uppercase;
}
.title {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: clamp(48px, 9vw, 112px);
  line-height: 0.92;
  letter-spacing: -0.04em;
  color: var(--ink);
}
.title-line { display: block; }
.title-italic {
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
  padding-left: 0.4em;
}
.subtitle {
  margin-top: 28px;
  font-size: 17px;
  color: var(--ink-soft);
  max-width: 460px;
  margin-left: auto;
  margin-right: auto;
}
.mode-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
  margin-top: 40px;
}
.mode-card {
  background: var(--card);
  border: 1px solid var(--line);
  padding: 32px 28px;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  color: inherit;
  position: relative;
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s;
  overflow: hidden;
}
.mode-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent);
  transform: translateY(101%);
  transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
  z-index: 0;
}
.mode-card:hover { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--ink); }
.mode-card:hover::before { transform: translateY(0); }
.mode-card:hover .mode-num,
.mode-card:hover .mode-name,
.mode-card:hover .mode-desc,
.mode-card:hover .mode-arrow { color: var(--card); }
.mode-card > * { position: relative; z-index: 1; transition: color 0.3s; }
.mode-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 18px;
  letter-spacing: 0.1em;
}
.mode-name {
  font-family: 'Fraunces', serif;
  font-size: 30px;
  font-weight: 400;
  font-style: italic;
  margin-bottom: 12px;
  letter-spacing: -0.01em;
}
.mode-desc {
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.55;
  margin-bottom: 32px;
}
.mode-arrow { font-size: 24px; color: var(--ink); }
.footer-line {
  margin-top: 56px;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-soft);
  letter-spacing: 0.25em;
  text-transform: uppercase;
}

/* ======= MODE SCREENS ======= */
.mode-screen { max-width: 920px; margin: 0 auto; padding: 8px 12px 40px; }
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 4px 24px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}
.back-btn {
  background: none;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink);
  cursor: pointer;
  letter-spacing: 0.1em;
  padding: 6px 0;
}
.back-btn:hover { color: var(--accent); }
.topbar-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 22px;
  flex: 1;
  text-align: center;
}
.topbar-spacer { width: 60px; }

/* ======= FILTER ======= */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px dashed var(--grid);
}
.filter-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-right: 4px;
}
.chip {
  background: transparent;
  border: 1px solid var(--line);
  padding: 6px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  color: var(--ink);
  letter-spacing: 0.05em;
  transition: all 0.2s;
}
.chip:hover { background: var(--ink); color: var(--bg); }
.chip-active { background: var(--ink); color: var(--bg); }

/* ======= FLASHCARDS ======= */
.progress-row { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
.progress-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  white-space: nowrap;
}
.progress-bar {
  flex: 1;
  height: 4px;
  background: var(--bg-deep);
  border: 1px solid var(--line);
  overflow: hidden;
}
.progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
.card-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 28px;
  margin: 20px auto 32px;
  max-width: 920px;
  align-items: start;
}
.card-layout.no-info {
  grid-template-columns: minmax(0, 520px);
  justify-content: center;
}
.card-stage { perspective: 1500px; min-width: 0; }
.flashcard {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 2;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
  cursor: pointer;
}
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: 4px 4px 0 var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.flashcard-back { transform: rotateY(180deg); }
.flag-img {
  max-width: 85%;
  max-height: 70%;
  object-fit: contain;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.card-hint {
  position: absolute;
  bottom: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--ink-soft);
  text-transform: uppercase;
}
.card-region {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.card-country {
  font-family: 'Fraunces', serif;
  font-size: clamp(26px, 5.5vw, 40px);
  font-weight: 400;
  font-style: italic;
  text-align: center;
  line-height: 1.0;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.card-endonym {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 17px;
  color: var(--ink-soft);
  text-align: center;
  line-height: 1.2;
  max-width: 90%;
}

/* Info panel beside flipped flashcard */
.info-panel {
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: 4px 4px 0 var(--ink);
  padding: 28px 28px 24px;
  opacity: 0;
  transform: translateX(-12px);
  transition: opacity 0.4s ease 0.3s, transform 0.4s ease 0.3s;
  pointer-events: none;
  align-self: stretch;
  display: flex;
  flex-direction: column;
}
.info-panel.visible {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}
.info-panel-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--grid);
  padding-bottom: 12px;
}
.info-panel-text {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  flex: 1;
  display: flex;
  align-items: center;
}
@media (max-width: 760px) {
  .card-layout {
    grid-template-columns: 1fr;
    max-width: 520px;
  }
  .card-layout.no-info {
    grid-template-columns: 1fr;
  }
  .info-panel { padding: 20px; }
  .info-panel-text { font-size: 14px; }
}

/* Zoom controls on map */
.zoom-controls {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 10;
}
.zoom-btn {
  width: 32px;
  height: 32px;
  background: var(--card);
  border: 1px solid var(--line);
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 400;
  cursor: pointer;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 2px 2px 0 var(--ink);
  transition: transform 0.15s;
  padding: 0;
}
.zoom-btn:hover { background: var(--ink); color: var(--bg); }
.zoom-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.zoom-indicator {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-align: center;
  color: var(--ink-soft);
  margin-top: 4px;
}
.map-wrap {
  position: relative;
}
.controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.controls-secondary { margin-top: 16px; text-align: center; }
.btn-primary, .btn-ghost {
  font-family: 'Inter Tight', sans-serif;
  font-size: 14px;
  padding: 12px 22px;
  border: 1px solid var(--line);
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: all 0.2s;
}
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: var(--ink); color: var(--bg); }
.link-btn {
  background: none;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  cursor: pointer;
  letter-spacing: 0.1em;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.link-btn:hover { color: var(--accent); }

/* ======= QUIZ ======= */
.score-row {
  display: flex;
  gap: 28px;
  align-items: flex-end;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.score-stat { text-align: left; }
.score-num {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 400;
  line-height: 1;
}
.score-num .unit { font-size: 14px; color: var(--ink-soft); margin-left: 2px; }
.score-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--ink-soft);
  text-transform: uppercase;
  margin-top: 4px;
}
.score-stat-accent .score-num { color: var(--accent); }
.quiz-stage { text-align: center; }
.quiz-flag-wrap {
  display: inline-block;
  margin: 12px 0 28px;
  padding: 8px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: 4px 4px 0 var(--ink);
}
.quiz-flag { display: block; max-width: 320px; width: 100%; height: auto; }
.quiz-prompt {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 22px;
  margin-bottom: 28px;
  color: var(--ink);
}
.quiz-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  max-width: 640px;
  margin: 0 auto;
}
.quiz-opt {
  background: var(--card);
  border: 1px solid var(--line);
  padding: 16px 20px;
  font-family: 'Inter Tight', sans-serif;
  font-size: 15px;
  cursor: pointer;
  color: var(--ink);
  transition: all 0.2s;
  text-align: left;
}
.quiz-opt:hover:not(:disabled) {
  background: var(--ink);
  color: var(--bg);
  transform: translate(-2px, -2px);
  box-shadow: 3px 3px 0 var(--ink);
}
.quiz-opt:disabled { cursor: default; }
.quiz-opt-correct { background: var(--correct) !important; color: var(--card) !important; border-color: var(--correct) !important; }
.quiz-opt-wrong { background: var(--wrong) !important; color: var(--card) !important; border-color: var(--wrong) !important; }
.quiz-opt-dim { opacity: 0.35; }

/* ======= MAP ======= */
.map-header {
  display: flex;
  gap: 20px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.map-prompt-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  padding: 10px 16px;
  box-shadow: 3px 3px 0 var(--ink);
}
.map-prompt-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.map-flag { width: 56px; height: auto; display: block; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
.map-prompt-name { font-family: 'Fraunces', serif; font-style: italic; font-size: 22px; }
.map-stats { display: flex; gap: 24px; align-items: flex-end; }
.map-wrap {
  border: 1px solid var(--line);
  background: var(--ocean);
  box-shadow: 4px 4px 0 var(--ink);
  margin-bottom: 18px;
  overflow: hidden;
}
.world-map { display: block; width: 100%; cursor: crosshair; }
.land-masses path {
  fill: var(--land);
  stroke: #d4a93a;      /* warm gold — high contrast against dark land */
  stroke-width: 1.4;    /* In screen pixels thanks to non-scaling-stroke below */
  stroke-linejoin: round;
  stroke-linecap: round;
  transition: fill 0.15s;
  vector-effect: non-scaling-stroke;  /* keep stroke width constant on zoom */
}
.land-masses path.hover-hint:hover { fill: #2d2620; cursor: crosshair; }
.land-masses path.target-flash {
  fill: var(--correct);
  stroke: #f0c95a;
  animation: targetPulse 1.4s ease-out;
}
.land-masses path.clicked-wrong {
  fill: var(--wrong);
  stroke: #f0c95a;
  animation: wrongFlash 0.6s ease-out;
}
@keyframes targetPulse {
  0% { fill: var(--gold); }
  50% { fill: var(--correct); }
  100% { fill: var(--correct); }
}
@keyframes wrongFlash {
  0%, 50% { fill: var(--wrong); }
  100% { fill: var(--wrong); }
}
.country-dot {
  fill: var(--gold);          /* gold dot — clearly visible as a clickable target */
  stroke: var(--ink);
  stroke-width: 1.2;
  vector-effect: non-scaling-stroke;
  transition: r 0.15s, fill 0.15s;
  cursor: crosshair;
}
.country-dot:hover { fill: #f0c95a; stroke-width: 2; }
.country-dot.target-flash { fill: var(--correct); stroke: #f0c95a; stroke-width: 2; }
.country-dot.clicked-wrong { fill: var(--wrong); stroke: #f0c95a; stroke-width: 2; }
.map-result {
  padding: 14px 20px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.map-result-correct { background: var(--correct); color: var(--card); border-color: var(--correct); }
.map-result-wrong { background: var(--card); color: var(--ink); }
.map-result-msg { font-family: 'Fraunces', serif; font-style: italic; font-size: 18px; }
.map-result-dist {
  font-family: 'JetBrains Mono', monospace;
  font-style: normal;
  font-size: 13px;
  opacity: 0.85;
  margin-left: 8px;
}
.map-help {
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.1em;
}


        /* ========== CHALLENGE MODE (Cartographer) ========== */
        .challenge-prompt {
          display: flex;
          align-items: center;
          gap: 18px;
          background: var(--card);
          border: 1px solid var(--line);
          padding: 14px 20px;
          box-shadow: 3px 3px 0 var(--ink);
          flex-wrap: wrap;
        }
        .challenge-flag-wrap {
          position: relative;
          display: block;
        }
        .challenge-flag {
          width: 96px;
          height: auto;
          display: block;
          box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .challenge-text {
          display: flex;
          flex-direction: column;
          gap: 4px;
          flex: 1;
          min-width: 160px;
        }
        .challenge-lbl {
          font-family: 'JetBrains Mono', monospace;
          font-size: 10px;
          letter-spacing: 0.25em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .challenge-name {
          font-family: 'Fraunces', serif;
          font-style: italic;
          font-size: 22px;
          line-height: 1.1;
        }
        .challenge-name-hidden {
          font-family: 'Fraunces', serif;
          font-style: italic;
          font-size: 22px;
          line-height: 1.1;
          color: var(--ink-soft);
          letter-spacing: 0.18em;
        }
        .challenge-reveal-btn {
          background: transparent;
          border: 1px solid var(--line);
          padding: 8px 16px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          cursor: pointer;
          color: var(--ink);
          transition: all 0.2s;
          align-self: center;
        }
        .challenge-reveal-btn:hover { background: var(--ink); color: var(--bg); }
        .challenge-reveal-btn:disabled {
          opacity: 0.45;
          cursor: default;
          background: transparent !important;
          color: var(--ink-soft) !important;
        }
        .challenge-revealed-tag {
          font-family: 'JetBrains Mono', monospace;
          font-size: 9px;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: var(--accent);
          margin-top: 4px;
        }

        /* Scoreboard with point-value chips and stats */
        .challenge-scoreboard {
          display: flex;
          gap: 28px;
          align-items: flex-end;
          flex-wrap: wrap;
        }
        .challenge-rules {
          display: flex;
          gap: 16px;
          margin-bottom: 18px;
          padding: 14px 18px;
          background: var(--bg-deep);
          border: 1px dashed var(--grid);
          align-items: center;
          flex-wrap: wrap;
        }
        .challenge-rules-lbl {
          font-family: 'JetBrains Mono', monospace;
          font-size: 10px;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: var(--ink-soft);
        }
        .pt-chip {
          display: inline-flex;
          align-items: baseline;
          gap: 8px;
          padding: 4px 10px;
          background: var(--card);
          border: 1px solid var(--line);
        }
        .pt-chip-val {
          font-family: 'Fraunces', serif;
          font-size: 17px;
          font-style: italic;
          font-weight: 600;
        }
        .pt-chip-desc {
          font-family: 'Inter Tight', sans-serif;
          font-size: 12px;
          color: var(--ink-soft);
        }
        .pt-chip-2 .pt-chip-val { color: var(--correct); }
        .pt-chip-1 .pt-chip-val { color: var(--gold); }
        .pt-chip-0 .pt-chip-val { color: var(--wrong); }

        /* Result banner enhancements specific to Cartographer */
        .challenge-result-pts {
          font-family: 'Fraunces', serif;
          font-size: 22px;
          font-style: italic;
          font-weight: 600;
        }
        .challenge-result-pts.pts-2 { color: #c4eccb; }
        .challenge-result-pts.pts-1 { color: var(--gold); }
        .challenge-result-pts.pts-0 { color: var(--ink); opacity: 0.6; }
        .map-result-correct .challenge-result-pts.pts-1 { color: #f4e0a8; }

        @media (max-width: 600px) {
  .topbar-title { font-size: 18px; }
  .score-row { gap: 18px; }
  .score-num { font-size: 24px; }
  .map-prompt-name { font-size: 18px; }
  .map-flag { width: 44px; }
  .map-header { gap: 12px; }

tine symbolism; red represents the blood and bravery of the Albanian people."},DZ:{endonym:"الجزائر (al-Jazāʾir)",info:"Two vertical halves — green and white — with a red star and crescent at center. Green represents Islam, white stands for purity and peace, and red marks the blood of those who died in the war of independence against France."},AD:{endonym:"Andorra",info:"Three vertical stripes — blue, yellow, red — with the national coat of arms in the center. The colors echo those of France and Spain, reflecting Andorra's historical co-principality status under both nations."},AO:{endonym:"Angola",info:"Two horizontal bands — red over black — with a yellow emblem of a half-cogwheel crossed by a machete, beneath a star. Red represents the blood of independence, black symbolizes Africa, and the emblem honors workers, peasants, and revolution."},AG:{endonym:"Antigua and Barbuda",info:"A rising golden sun on a black band against a V-shape of blue and white over red. The sun signals a new era, black represents the African heritage of the people, blue is for hope, white for the beaches, and red for the energy of the people."},AR:{endonym:"Argentina",info:"Three horizontal stripes — light blue, white, light blue — with a golden Sun of May in the center. The colors are traditionally said to represent the sky and clouds; the sun, with a human face, commemorates the May 1810 revolution against Spanish rule."},AM:{endonym:"Հայաստան (Hayastan)",info:"Three horizontal bands — red, blue, orange. Red symbolizes the Armenian Highland and the blood shed for survival, blue stands for the peaceful sky, and orange represents the creative talent and hardworking nature of the Armenian people."},AU:{endonym:"Australia",info:"The British Union Jack in the canton acknowledges colonial heritage. The large seven-pointed Commonwealth Star represents the six states and the territories. The Southern Cross constellation on the fly side reflects Australia's place in the southern hemisphere."},AT:{endonym:"Österreich",info:"Three horizontal stripes — red, white, red. One of the world's oldest national flags, said by legend to come from Duke Leopold V's tunic, which was stained red with blood except for a white band where his belt had been."},AZ:{endonym:"Azərbaycan",info:"Three horizontal bands — blue, red, green — with a white crescent and eight-pointed star. Blue represents Turkic heritage, red stands for progress and modernization, and green is for Islam. The star's eight points represent the eight branches of the Turkic peoples."},BS:{endonym:"The Bahamas",info:"Three horizontal stripes — aquamarine, gold, aquamarine — with a black triangle on the hoist side. Aquamarine represents the surrounding sea, gold the sun and sand, and the black triangle stands for the strength and unity of the Bahamian people."},BH:{endonym:"البحرين (al-Baḥrayn)",info:"A red field with a white serrated band on the hoist side. The five white triangular points represent the five pillars of Islam. Red is a traditional color of the Persian Gulf states."},BD:{endonym:"বাংলাদেশ (Bangladesh)",info:"A red disc slightly offset toward the hoist on a green field. The red disc represents the sun rising over Bengal and the blood shed for independence; green stands for the lush landscape and Islamic heritage."},BB:{endonym:"Barbados",info:"Three vertical bands — ultramarine, gold, ultramarine — with a black trident head in the center. The trident, broken from its staff, symbolizes a break from colonial rule. Blue stands for the sea and sky, gold for the sand."},BY:{endonym:"Беларусь (Belarus)",info:"A red horizontal band over a narrower green one, with a red-on-white traditional ornamental pattern on the hoist side. Red represents the past and historical battles, green stands for forests and future, and the ornament reflects folk craft heritage."},BE:{endonym:"België / Belgique / Belgien",info:"Three vertical stripes — black, yellow, red — drawn from the coat of arms of the Duchy of Brabant. The proportions are unusual (closer to square than most tricolors), and the design dates to the 1830 revolution that established Belgian independence."},BZ:{endonym:"Belize",info:"A royal blue field with red bands at top and bottom and a white disc in the center bearing the coat of arms. The shield depicts logging tools, recognizing the country's mahogany industry, supported by a mestizo and an Afro-Belizean worker beneath a mahogany tree."},BJ:{endonym:"Bénin",info:"A green vertical band on the hoist side, with horizontal yellow and red bands on the fly side. Green represents hope and revival, yellow the savannas and wealth, and red the courage of ancestors. The colors are the traditional Pan-African palette."},BT:{endonym:"འབྲུག་ཡུལ (Druk Yul)",info:"A diagonal divide of saffron-yellow (upper hoist) and orange (lower fly) with a white dragon — the Druk, or 'Thunder Dragon' — across the line. Yellow represents the secular monarchy, orange the Buddhist faith, and the dragon's jewels stand for the nation's wealth."},BO:{endonym:"Bolivia",info:"Three horizontal stripes — red, yellow, green. Red symbolizes the blood of national heroes, yellow the country's mineral wealth, and green the fertility of the land. A state version bears the coat of arms in the center."},BA:{endonym:"Bosna i Hercegovina",info:"A blue field with a yellow triangle, alongside seven full white five-pointed stars and two half stars along the triangle's hypotenuse. The triangle's three points represent the country's three main ethnic groups; the stars suggest Europe, continuing infinitely."},BW:{endonym:"Botswana",info:"A light blue field with a black horizontal stripe edged in white across the center. Blue represents water — vital and scarce — and is drawn from the country's motto Pula ('rain'). The black-and-white striping symbolizes racial harmony."},BR:{endonym:"Brasil",info:"A green field with a large yellow rhombus, inside which a blue celestial sphere shows 27 white stars (one for each state and the Federal District) and a curved band with the motto 'Ordem e Progresso.' Green and yellow originally honored the imperial houses of Bragança and Habsburg."},BN:{endonym:"Brunei",info:"A yellow field with two diagonal stripes of black and white, and a red emblem at center showing a parasol, wings, hands, and a crescent inscribed with the national motto in Arabic. Yellow is the traditional color of Bruneian royalty."},BG:{endonym:"България (Bulgaria)",info:"Three horizontal stripes — white, green, red. White is said to represent peace, love, and freedom; green stands for the country's agricultural wealth and forests; red symbolizes the courage and blood of those who fought for independence."},BF:{endonym:"Burkina Faso",info:"Two horizontal stripes — red and green — with a yellow five-pointed star in the center. Red represents the revolution, green the abundance of agricultural and natural riches, and the yellow star is the guiding light of the revolution."},BI:{endonym:"Uburundi / Burundi",info:"A white saltire dividing the field into red (top and bottom) and green (sides), with a central white disc bearing three red six-pointed stars. The stars stand for the national motto: Unity, Work, Progress — and the three main ethnic groups."},CV:{endonym:"Cabo Verde",info:"A blue field with three horizontal stripes (white-red-white) crossing the lower half, and a ring of ten yellow stars on the hoist side. The stars represent the ten main islands. Blue is the sea and sky, white peace, red effort."},KH:{endonym:"កម្ពុជា (Kâmpŭchéa)",info:"Three horizontal stripes — blue, red (double width), blue — with a white silhouette of Angkor Wat at the center. Cambodia is the only national flag to feature a building. Red and blue are traditional Cambodian colors; the temple represents heritage and integrity."},CM:{endonym:"Cameroun / Cameroon",info:"Three vertical stripes — green, red, yellow — with a yellow star at the center of the red band. Green stands for the forests of the south, yellow for the savannas of the north, and red for unity. The colors are Pan-African."},CA:{endonym:"Canada",info:"Two vertical red bands flanking a white square containing a stylized red 11-pointed maple leaf. Adopted in 1965, replacing the Red Ensign. The maple leaf has long symbolized Canada; red and white were declared national colors by King George V in 1921."},CF:{endonym:"République centrafricaine / Ködörösêse tî Bêafrîka",info:"Four horizontal stripes — blue, white, green, yellow — crossed by a vertical red band, with a yellow star in the upper hoist. The design combines Pan-African colors (red, green, yellow) with the French tricolor's blue and white, symbolizing both heritages."},TD:{endonym:"Tchad / تشاد",info:"Three vertical stripes — blue, yellow, red. Blue represents the sky, hope, and the southern waters; yellow stands for the sun and the northern desert; red symbolizes the bloodshed for independence and national unity."},CL:{endonym:"Chile",info:"A horizontal band of white over red, with a blue square in the upper hoist bearing a white five-pointed star. White represents the snow of the Andes, blue the sky, red the blood of those who fought for independence. The star is a guide on the path of progress."},CN:{endonym:"中国 (Zhōngguó)",info:"A red field with a large yellow five-pointed star and four smaller stars in an arc. Red represents the communist revolution and Chinese tradition. The large star symbolizes the Communist Party; the four smaller stars represent the social classes united under it."},CO:{endonym:"Colombia",info:"Three horizontal stripes — yellow (top, double width), blue, red. Yellow represents the country's wealth and the sun, blue stands for the seas and rivers, and red commemorates the blood spilled for independence. The design is shared with Ecuador and Venezuela, all once part of Gran Colombia."},KM:{endonym:"Komori / جزر القمر",info:"Four horizontal stripes — yellow, white, red, blue — with a green triangle on the hoist side bearing a white crescent and four stars. The colors represent the four main islands; the crescent and stars are Islamic symbols."},CD:{endonym:"République démocratique du Congo",info:"A sky-blue field crossed by a red diagonal stripe edged in yellow, with a yellow star in the upper hoist. Blue represents peace, red the blood of martyrs, yellow the country's mineral wealth, and the star a bright future."},CG:{endonym:"République du Congo",info:"A yellow diagonal band from lower hoist to upper fly, separating a green upper triangle from a red lower triangle. The Pan-African colors represent African unity; the design is one of the few national flags using a diagonal layout."},CR:{endonym:"Costa Rica",info:"Five horizontal stripes — blue, white, red (double width), white, blue. Blue stands for the sky, opportunities, and intellectual thought; white for peace and wisdom; red for the warmth of the people and the blood spilled for freedom."},CI:{endonym:"Côte d'Ivoire",info:"Three vertical stripes — orange, white, green. Orange represents the savannas of the north and the country's growth; white stands for peace; green stands for the forests of the south and hope. The layout mirrors Ireland's flag in reverse."},HR:{endonym:"Hrvatska",info:"Three horizontal stripes — red, white, blue — with the Croatian coat of arms (a red-and-white checkerboard topped by five smaller shields) in the center. The Pan-Slavic colors signal Slavic heritage; the chequy shield dates back centuries."},CU:{endonym:"Cuba",info:"Three blue stripes alternating with two white ones, and a red equilateral triangle on the hoist side bearing a white five-pointed star. The three blue stripes represent the three old departments; white stands for purity; the red triangle and star signal liberty achieved through bloodshed."},CY:{endonym:"Κύπρος / Kıbrıs",info:"A white field bearing a copper-colored silhouette of the island above two crossed olive branches. The map color refers to Cyprus's ancient copper deposits (the island's name is the source of the word 'copper'); the olive branches symbolize peace between communities."},CZ:{endonym:"Česko",info:"Two horizontal stripes — white over red — with a blue triangle extending from the hoist. Red and white were the colors of Bohemia; blue was added to represent Moravia and Slovakia when Czechoslovakia adopted the flag in 1920. Retained after the 1993 split."},DK:{endonym:"Danmark",info:"A red field with a white Scandinavian cross, offset toward the hoist. Known as the Dannebrog, it is the oldest continuously used national flag in the world, with legendary origins dating to 1219. The Nordic cross pattern was later adopted by other Scandinavian countries."},DJ:{endonym:"Djibouti / جيبوتي",info:"Two horizontal stripes — light blue over green — with a white triangle on the hoist side bearing a red five-pointed star. Blue represents the sea and sky and the Issa people, green stands for the earth and the Afar people, white for peace, and the red star for unity."},DM:{endonym:"Dominica",info:"A green field with a centered tricolor cross of yellow, black, and white, and a red disc in the center bearing a Sisserou parrot encircled by ten green stars. Green represents the forests, the cross the Trinity and Christian faith, and the parrot — the national bird — appears nowhere else on a flag."},DO:{endonym:"República Dominicana",info:"A white cross divides the field into four rectangles: blue and red, alternating. The national coat of arms sits at the center. Blue represents liberty, red the blood of heroes, and white salvation. It is the only national flag to feature the Bible in its coat of arms."},EC:{endonym:"Ecuador",info:"Three horizontal stripes — yellow (double width), blue, red — with the coat of arms in the center. Same Gran Colombian heritage as Colombia and Venezuela. Yellow stands for the sun and the country's wealth, blue for the sky and sea, red for the blood of heroes."},EG:{endonym:"مصر (Miṣr)",info:"Three horizontal stripes — red, white, black — with the golden Eagle of Saladin at the center. Red represents the period before the 1952 revolution, white the bloodless revolution itself, and black the end of foreign oppression. The eagle is a historic symbol of Arab nationalism."},SV:{endonym:"El Salvador",info:"Two horizontal blue stripes flanking a white stripe with the national coat of arms in the center. The Federal Republic of Central America blue-white-blue layout is shared with neighbors. The blue stands for the two oceans bordering Central America, white for peace."},GQ:{endonym:"Guinea Ecuatorial",info:"Three horizontal stripes — green, white, red — with a blue triangle on the hoist side and the coat of arms in the center. Green represents the jungle, white peace, red the struggle for independence, and the blue triangle the sea."},ER:{endonym:"ኤርትራ (Ertra)",info:"A red triangle pointing toward the fly side, separating a green upper triangle from a blue lower triangle, with a gold olive wreath and branch on the red. Red stands for the blood of those who fought for liberty, green for agriculture, and blue for the sea."},EE:{endonym:"Eesti",info:"Three horizontal stripes — blue, black, white. Blue represents the sky, sea, and lakes, as well as faith and loyalty; black symbolizes the soil and the dark past of suffering; white stands for snow, birch bark, and the striving for freedom and enlightenment."},SZ:{endonym:"eSwatini",info:"Five horizontal stripes (blue, yellow, red, yellow, blue), with the central red band bearing a large black-and-white Nguni shield, two spears, and a 'fighting stick' adorned with feather tassels. Blue stands for peace, yellow for resources, and red for past battles."},ET:{endonym:"ኢትዮጵያ (Ītyōṗṗyā)",info:"Three horizontal stripes — green, yellow, red — with a blue disc bearing a yellow pentagram and rays. Ethiopia's colors became the basis of the Pan-African palette. The star represents unity and the bright future of the country's diverse peoples."},FJ:{endonym:"Viti / Fiji",info:"A light blue field with the Union Jack in the canton and the shield from the Fijian coat of arms on the fly side. Light blue represents the Pacific Ocean; the shield includes St. George's cross and symbols of agriculture: sugarcane, coconut, a dove, and a banana."},FI:{endonym:"Suomi",info:"A white field with a blue Nordic cross offset toward the hoist. Blue represents the country's thousands of lakes and the sky; white stands for the snow that covers the land in winter. The Nordic cross pattern reflects shared Scandinavian heritage."},FR:{endonym:"France",info:"Three vertical stripes — blue, white, red. The tricolore emerged from the French Revolution in 1789, combining the red and blue of Paris with the white traditionally associated with the Bourbon monarchy. It has inspired tricolor flags worldwide."},GA:{endonym:"Gabon",info:"Three horizontal stripes — green, yellow, blue. Green represents the country's vast forests, yellow the equator that runs through Gabon and the sun, and blue the Atlantic Ocean. Notably, Gabon does not use the Pan-African color palette."},GM:{endonym:"The Gambia",info:"Three horizontal stripes — red, blue, green — separated by thin white bands. Red represents the sun and the savanna, blue the Gambia River that defines the country, green the agricultural land and forests, and white the unity and peace between them."},GE:{endonym:"საქართველო (Sakartvelo)",info:"A white field with a central red cross, and four smaller red Bolnisi crosses (one in each quadrant). Known as the 'five-cross flag,' it dates back to medieval Georgian heraldry and was readopted in 2004 after centuries of disuse."},DE:{endonym:"Deutschland",info:"Three horizontal stripes — black, red, gold. The colors trace to the uniforms of the Lützow Free Corps in the Napoleonic Wars and the 1848 revolutions. They became symbols of liberal-democratic Germany and were officially adopted in 1919, restored in 1949."},GH:{endonym:"Ghana",info:"Three horizontal stripes — red, gold, green — with a black five-pointed star in the center of the gold band. The first African nation to use the Pan-African colors after independence (1957). The black star represents African emancipation and unity."},GR:{endonym:"Ελλάδα (Elláda)",info:"Nine horizontal stripes alternating blue and white, with a white cross on a blue square in the canton. The nine stripes are said to represent the syllables of the Greek phrase 'Eleutheria i thanatos' ('Freedom or Death'). The cross honors Greek Orthodox Christianity."},GD:{endonym:"Grenada",info:"A red border surrounds two yellow triangles (top and bottom) and two green triangles (sides), with seven yellow stars on the red border and a nutmeg pod on the hoist green triangle. The nutmeg honors Grenada's spice industry; the seven stars represent the parishes."},GT:{endonym:"Guatemala",info:"Three vertical stripes — light blue, white, light blue — with the coat of arms in the center. The arms feature a resplendent quetzal (the national bird, symbolizing liberty) and a scroll noting the date of independence from Spain in 1821."},GN:{endonym:"Guinée",info:"Three vertical stripes — red, yellow, green. The classic Pan-African palette, inspired by Ghana and adapted in the French tricolor layout. Red stands for the blood of martyrs, yellow for the sun and African wealth, and green for the country's vegetation."},GW:{endonym:"Guiné-Bissau",info:"A red vertical band on the hoist side with a black five-pointed star, and horizontal yellow over green stripes on the fly side. The Pan-African colors symbolize struggle (red), the sun (yellow), hope (green), and the black star represents African unity."},GY:{endonym:"Guyana",info:"Known as the 'Golden Arrowhead': a green field with a yellow triangle bordered in white pointing from the hoist, overlaid with a red triangle bordered in black. Green is for forests and agriculture, gold for mineral wealth, white for rivers, red for zeal, and black for endurance."},HT:{endonym:"Ayiti / Haïti",info:"Two horizontal stripes — blue over red — with the national coat of arms on a white square in the center. Said to derive from the French tricolor with the white removed during the slave revolt. Blue represents Black Haitians, red mulattoes, and the arms include a palm and cannons."},HN:{endonym:"Honduras",info:"Three horizontal stripes — blue, white, blue — with five blue stars in a quincunx pattern on the white band. The stars represent the five Central American nations of the former federation, with the hope of reunification. Blue is for the two oceans, white for peace."},HU:{endonym:"Magyarország",info:"Three horizontal stripes — red, white, green. Traditionally, red represents strength, white faithfulness, and green hope. The colors have been associated with Hungary since medieval times, formalized in the 19th century."},IS:{endonym:"Ísland",info:"A blue field with a white-bordered red Nordic cross. Blue represents the surrounding Atlantic Ocean, white the snow and ice that give the country its name, and red the volcanic fires beneath. The Nordic cross marks shared Scandinavian heritage."},IN:{endonym:"भारत (Bhārat)",info:"Three horizontal stripes — saffron, white, green — with a navy blue 24-spoke Ashoka Chakra (Dharma wheel) at the center. Saffron stands for courage and sacrifice, white for peace and truth, green for faith and fertility. The wheel represents law, motion, and progress."},ID:{endonym:"Indonesia",info:"Two horizontal stripes — red over white. The colors have ancient roots in the Majapahit Empire. Red represents courage and the body, white represents purity and the soul. The flag is nearly identical to Monaco's but proportionally different."},IR:{endonym:"ایران (Īrān)",info:"Three horizontal stripes — green, white, red — with a stylized red emblem in the center reading 'Allah' and the takbir ('God is great') 22 times in Kufic script along the inner edges of the green and red bands. Green stands for Islam, white for peace, red for courage."},IQ:{endonym:"العراق (al-ʿIrāq)",info:"Three horizontal stripes — red, white, black — with the takbir ('Allāhu akbar') in green Kufic script across the white band. The Pan-Arab colors; red for courage, white for generosity, black for the Abbasid caliphate, and green for Islam."},IE:{endonym:"Éire",info:"Three vertical stripes — green, white, orange. Green represents Irish Catholics and the Gaelic tradition, orange represents Irish Protestants (after William of Orange), and the white between them symbolizes a lasting peace between the two communities."},IL:{endonym:"ישראל (Yisra'el)",info:"A white field with two horizontal blue stripes near the top and bottom, and a blue Star of David in the center. The design recalls the tallit (Jewish prayer shawl). The Magen David has been a Jewish symbol since at least the Middle Ages."},IT:{endonym:"Italia",info:"Three vertical stripes — green, white, red. The colors trace to the Cisalpine Republic of 1797, inspired by the French tricolor. Green is often said to represent hope, white faith, and red charity; alternatively, the landscape, the Alps, and bloodshed for unification."},JM:{endonym:"Jamaica",info:"A gold saltire dividing the field into green (top and bottom) and black (sides). Gold represents the sun and the country's natural wealth, green stands for hope and agricultural resources, and black represents the strength and creativity of the people."},JP:{endonym:"日本 (Nihon / Nippon)",info:"A white field with a large red disc in the center — the 'Hinomaru,' or 'circle of the sun.' Japan is often called the Land of the Rising Sun; the design dates back centuries and was officially adopted as the national flag in 1870 and reaffirmed in 1999."},JO:{endonym:"الأردن (al-Urdunn)",info:"Three horizontal stripes — black, white, green — with a red triangle on the hoist side bearing a white seven-pointed star. The four Pan-Arab colors represent the Abbasid, Umayyad, and Fatimid caliphates and the Hashemite dynasty. The star's points refer to the seven verses of the Fatiha."},KZ:{endonym:"Қазақстан (Qazaqstan)",info:"A sky-blue field with a golden sun of 32 rays above a soaring golden steppe eagle, and a vertical ornamental pattern along the hoist. Blue represents the sky, peace, and the Turkic peoples; the sun stands for life and energy; the eagle symbolizes freedom."},KE:{endonym:"Kenya",info:"Three horizontal stripes — black, red, green — separated by thin white fimbriations, with a traditional Maasai shield and two crossed spears at the center. Black represents the people, red the blood shed for freedom, green the landscape, and white peace and unity."},KI:{endonym:"Kiribati",info:"A red upper half with a yellow sun rising over wavy blue and white bands representing the Pacific Ocean, and a yellow frigatebird in flight above the sun. The 17 rays of the sun and waves represent the 16 Gilbert Islands plus Banaba. The bird symbolizes freedom."},XK:{endonym:"Kosova / Kosovo",info:"A blue field with the golden silhouette of Kosovo's map and six white five-pointed stars in an arc above. The six stars represent the six main ethnic groups of Kosovo. The design was selected to be intentionally neutral and inclusive after independence in 2008."},KW:{endonym:"الكويت (al-Kuwayt)",info:"Three horizontal stripes — green, white, red — with a black trapezoid on the hoist side. The Pan-Arab colors: green for the land's fertility, white for the purity of deeds, red for the blood on swords, and black for the defeat of enemies (from a classical Arab poem)."},KG:{endonym:"Кыргызстан (Kyrgyzstan)",info:"A red field with a yellow sun of 40 rays in the center, overlaid with a red emblem representing the crown of a yurt (tündük). The 40 rays represent the 40 Kyrgyz tribes united by the epic hero Manas. The yurt symbol honors traditional nomadic life and family."},LA:{endonym:"ລາວ (Lao)",info:"Three horizontal stripes — red, blue (double width), red — with a white disc in the center of the blue band. Red represents the blood shed for independence, blue the Mekong River and prosperity, and the white disc the moon over the river or the unity of the people."},LV:{endonym:"Latvija",info:"A deep maroon ('Latvian red') field with a narrow white horizontal stripe across the center. The red is said by legend to come from a wounded Latvian leader's bloodstained sheet, with the white showing where his body lay. One of the world's oldest flag designs."},LB:{endonym:"لبنان (Lubnān)",info:"Three horizontal stripes — red, white (double width), red — with a green cedar tree in the center of the white band. The cedar of Lebanon is an ancient and sacred symbol of the country, mentioned in the Bible; red and white represent purity and sacrifice."},LS:{endonym:"Lesotho",info:"Three horizontal stripes — blue, white, green — with a black mokorotlo (traditional Basotho hat) in the center of the white band. Blue stands for rain, white for peace, and green for prosperity. Adopted in 2006 to replace a more militaristic design."},LR:{endonym:"Liberia",info:"Eleven alternating red and white stripes with a blue square in the canton bearing a single white star. The design clearly echoes the United States flag, reflecting Liberia's founding by freed American slaves. The 11 stripes represent the signers of the Declaration of Independence."},LY:{endonym:"ليبيا (Lībiyā)",info:"Three horizontal stripes — red, black (double width), green — with a white crescent and star in the center. Originally the flag of the Kingdom of Libya (1951–1969), it was restored after the 2011 revolution. The colors trace to the historical regions of the country."},LI:{endonym:"Liechtenstein",info:"Two horizontal stripes — blue over red — with a gold crown in the upper hoist canton. The crown was added in 1937 after Liechtenstein discovered that its flag was identical to Haiti's at the Berlin Olympics; the crown distinguishes the two and represents the monarchy."},LT:{endonym:"Lietuva",info:"Three horizontal stripes — yellow, green, red. Yellow represents the sun, prosperity, and the country's wheatfields; green stands for the forests, countryside, hope, and freedom; red marks the blood shed for the nation and courage."},LU:{endonym:"Lëtzebuerg",info:"Three horizontal stripes — red, white, light blue. Nearly identical to the Netherlands flag but with a lighter shade of blue and slightly different proportions. The colors derive from the coat of arms of the Grand Duchy, with the red lion of Luxembourg on white."},MG:{endonym:"Madagasikara",info:"A white vertical band on the hoist side with horizontal red over green stripes on the fly. The red and white recall earlier Merina kingdom flags; green represents the Hova people (peasants and farmers). The layout is unusual in combining vertical and horizontal bands."},MW:{endonym:"Malaŵi",info:"Three horizontal stripes — black, red, green — with a red rising sun on the black band. Black represents the African peoples, red the blood of martyrs for African freedom, and green the country's evergreen landscape. The rising sun symbolizes hope for Africa."},MY:{endonym:"Malaysia",info:"14 alternating red and white horizontal stripes, with a blue canton bearing a yellow crescent and 14-pointed star. The stripes and points represent the 13 states plus the federal government. Yellow is the royal color, blue represents unity, and the crescent and star are Islamic symbols."},MV:{endonym:"ދިވެހިރާއްޖެ (Dhivehi Raajje)",info:"A red field with a large green rectangle in the center bearing a white crescent open toward the fly. Red represents the blood of national heroes, green the palm trees and prosperity, and the crescent the Islamic faith of the Maldivian people."},ML:{endonym:"Mali",info:"Three vertical stripes — green, yellow, red. The classic Pan-African palette, inspired by Ghana and laid out in the French tricolor format. Green stands for the land's fertility, yellow for purity and mineral wealth, and red for the blood shed for independence."},MT:{endonym:"Malta",info:"Two vertical stripes — white (hoist) and red — with a representation of the George Cross outlined in red in the upper hoist corner. The George Cross was awarded to Malta by King George VI in 1942 for its bravery during World War II. Red and white are traditional Maltese colors."},MH:{endonym:"Marshall Islands",info:"A blue field with two diagonal stripes — orange over white — widening from lower hoist to upper fly, and a large white 24-point star in the upper hoist. Blue represents the Pacific Ocean; the star's points represent the 24 electoral districts; orange is for bravery, white for peace."},MR:{endonym:"موريتانيا (Mūrītānyā)",info:"A green field with two horizontal red stripes (top and bottom) and a centered yellow crescent and star. Green and the crescent represent Islam, gold stands for the sands of the Sahara, and red (added in 2017) honors the blood shed by those who fought against colonizers."},MU:{endonym:"Mauritius",info:"Four horizontal stripes — red, blue, yellow, green. Red represents the struggle for independence, blue the surrounding Indian Ocean, yellow the new light of independence shining over the country, and green the lush vegetation of the island."},MX:{endonym:"México",info:"Three vertical stripes — green, white, red — with the national coat of arms in the center: a golden eagle perched on a prickly-pear cactus, devouring a serpent. The image comes from an Aztec legend marking the founding of Tenochtitlán, the future Mexico City."},FM:{endonym:"Micronesia",info:"A light blue field with four white five-pointed stars arranged in a diamond. Blue represents the Pacific Ocean; the four stars represent the four states of the Federated States of Micronesia: Yap, Chuuk, Pohnpei, and Kosrae."},MD:{endonym:"Moldova",info:"Three vertical stripes — blue, yellow, red — with the national coat of arms on the yellow band: an eagle holding a cross, scepter, and olive branch, with an aurochs head on its breast. Closely related to Romania's flag, reflecting shared Latin heritage."},MC:{endonym:"Monaco",info:"Two horizontal stripes — red over white. The colors come from the heraldic shield of the House of Grimaldi, which has ruled Monaco since 1297. The flag is nearly identical to Indonesia's, differing only in proportions; it is among the oldest national flags."},MN:{endonym:"Монгол улс (Mongol Uls)",info:"Three vertical stripes — red, blue, red — with the gold Soyombo symbol on the hoist-side red band. The Soyombo contains fire, sun, moon, earth, water, and yin-yang, expressing Mongolian cosmology and independence. Blue stands for the eternal sky, red for prosperity."},ME:{endonym:"Crna Gora",info:"A red field with a wide golden border and the Montenegrin coat of arms (a double-headed eagle holding a scepter and orb, with a lion on its breast) in the center. The design is based on the royal standard of King Nicholas I and the medieval state symbols."},MA:{endonym:"المغرب (al-Maġrib)",info:"A red field with a green five-pointed pentagram (Solomon's seal) in the center. Red has been used by Moroccan rulers since the 17th century; the green pentagram was added in 1915 and represents the seal of Solomon, with the five points referring to the pillars of Islam."},MZ:{endonym:"Moçambique",info:"Three horizontal stripes — green, black (white-edged), yellow — with a red triangle at the hoist bearing a yellow star, an open book, a hoe, and an AK-47. It is the only national flag to depict a modern firearm, symbolizing defense and vigilance."},MM:{endonym:"မြန်မာ (Mranma)",info:"Three horizontal stripes — yellow, green, red — with a large white five-pointed star in the center. Yellow represents solidarity, green peace and tranquility plus the lush landscape, red courage and decisiveness, and the white star the union of the country."},NA:{endonym:"Namibia",info:"A diagonal red stripe edged in white from lower hoist to upper fly, separating a blue upper triangle (with a 12-rayed gold sun) from a green lower triangle. Blue is the sky and the Atlantic, red the people's heroism, white peace, green vegetation, and the sun life and energy."},NR:{endonym:"Nauru",info:"A blue field crossed by a thin yellow horizontal stripe, with a white twelve-pointed star below the stripe on the hoist side. The yellow line represents the equator, the star Nauru's position just below it, and the twelve points represent the twelve original tribes of Nauru."},NP:{endonym:"नेपाल (Nepāl)",info:"Two stacked crimson triangles (one above the other) bordered in blue — the only non-rectangular national flag in the world. Crimson is Nepal's national color; the two triangles represent the Himalayas and the Hindu-Buddhist heritage. The sun and moon depicted within once had faces."},NL:{endonym:"Nederland",info:"Three horizontal stripes — red, white, blue. The oldest tricolor still in use, derived from the orange-white-blue 'Prinsenvlag' carried by William of Orange in the 1572 revolt against Spain. Orange faded to red over the centuries. The flag inspired Russia's tricolor and many others."},NZ:{endonym:"New Zealand / Aotearoa",info:"A blue field with the Union Jack in the canton and four red, white-edged five-pointed stars representing the Southern Cross constellation on the fly. The flag reflects British heritage and New Zealand's position in the southern hemisphere, beneath these stars."},NI:{endonym:"Nicaragua",info:"Three horizontal stripes — blue, white, blue — with the national coat of arms in the center. The arms show five volcanoes (the Central American republics), a Phrygian cap (liberty), and a rainbow. Blue stands for the Atlantic and Pacific, white for peace and the land between them."},NE:{endonym:"Niger",info:"Three horizontal stripes — orange, white, green — with an orange disc in the center of the white band. Orange represents the Sahara desert in the north, white purity and the river, green the fertile lands of the south, and the disc represents the sun."},NG:{endonym:"Nigeria",info:"Three vertical stripes — green, white, green. Green represents the country's natural wealth and agriculture, and white stands for peace and unity. The design was selected through a public competition in 1959; the original entry included a red sun, which was removed."},KP:{endonym:"조선 (Chosŏn)",info:"A wide central red horizontal stripe edged with thin white and broader blue stripes at top and bottom, with a white disc bearing a red five-pointed star toward the hoist. Red stands for revolutionary tradition, blue for sovereignty and unity, white for purity, and the star for communism."},MK:{endonym:"Северна Македонија (Severna Makedonija)",info:"A red field with a stylized yellow sun of eight broadening rays radiating to the edges of the flag. The 'new sun of liberty' was adopted in 1995 to replace the earlier Vergina Sun design after a dispute with Greece. Red and yellow are historic Macedonian colors."},NO:{endonym:"Norge",info:"A red field with a blue Nordic cross outlined in white, offset toward the hoist. The cross marks Norway's Christian Scandinavian heritage. The colors echo the French tricolor (an inspiration during the 1821 design), but rearranged into the Nordic cross pattern."},OM:{endonym:"عمان (ʿUmān)",info:"Three horizontal stripes — white, red, green — with a vertical red band on the hoist bearing the national emblem (crossed khanjar dagger and swords). White represents peace and prosperity, red the battles to expel foreign invaders, and green the fertile mountains and Islam."},PK:{endonym:"پاکستان (Pākistān)",info:"A dark green field with a white vertical stripe on the hoist side, and a white crescent and five-pointed star centered on the green. Green and the crescent represent Islam and the Muslim majority; the white stripe represents religious minorities and minority peace."},PW:{endonym:"Belau / Palau",info:"A light blue field with a large yellow disc slightly offset toward the hoist. Blue represents the Pacific Ocean and the transition from foreign rule to self-governance, while the disc represents the full moon — considered the most favorable time in traditional Palauan culture."},PS:{endonym:"فلسطين (Filasṭīn)",info:"Three horizontal stripes — black, white, green — with a red triangle on the hoist side. The Pan-Arab colors: black for the Abbasid caliphate, white for the Umayyad, green for the Fatimid, and red for the Hashemite dynasty and the unity of the Arab nation."},PA:{endonym:"Panamá",info:"A field divided into four quarters: white with a blue star (upper hoist), red (upper fly), white with a red star (lower fly), and blue (lower hoist). Blue and red represent the country's two main political parties at independence; white represents peace between them."},PG:{endonym:"Papua Niugini",info:"A diagonal split from upper hoist to lower fly: black upper triangle with five white stars of the Southern Cross, and red lower triangle with a golden bird-of-paradise. Black, red, and yellow are traditional New Guinea colors; the bird is the national symbol."},PY:{endonym:"Paraguay",info:"Three horizontal stripes — red, white, blue — with the national coat of arms on the obverse and the treasury seal on the reverse. It is one of only a few national flags with different obverse and reverse designs. Red, white, and blue represent independence, peace, and justice."},PE:{endonym:"Perú",info:"Three vertical stripes — red, white, red. By tradition, the design comes from José de San Martín, the liberator, who saw flamingos with red wings and white bodies and chose those colors. A state version adds the coat of arms with a vicuña, cinchona tree, and cornucopia."},PH:{endonym:"Pilipinas",info:"Two horizontal stripes — blue over red — with a white equilateral triangle at the hoist bearing a golden sun with eight rays and three five-pointed stars at the corners. The eight rays represent the eight provinces that began the revolution; the three stars represent the three major island groups."},PL:{endonym:"Polska",info:"Two horizontal stripes — white over red. The colors come from the Polish coat of arms — a white eagle on a red field. White is associated with the eagle and represents nobility and peace; red represents the blood spilled in the struggle for independence."},PT:{endonym:"Portugal",info:"Two vertical bands — green (smaller, on the hoist) and red — with the national coat of arms on the dividing line. Red represents the blood of those who died for the country, green represents hope. The arms include the Portuguese shield with the seven castles and five quinas."},QA:{endonym:"قطر (Qaṭar)",info:"A maroon field with a wide vertical white serrated band on the hoist side (nine points). The maroon, originally a darker shade of red, became maroon over time from sun exposure. The nine points indicate Qatar's status as the 9th member of the 'reconciled emirates' after the 1916 treaty."},RO:{endonym:"România",info:"Three vertical stripes — blue, yellow, red. The colors trace back to medieval principalities and Romanian unification in the 19th century. Blue, yellow, and red have been associated with the Romanian people for centuries; the modern tricolor was adopted after 1989."},RU:{endonym:"Россия (Rossiya)",info:"Three horizontal stripes — white, blue, red. The colors trace to the 17th-century Tsar Peter the Great, who modeled them on the Dutch flag during his shipbuilding tours. The white-blue-red palette became the basis for many other Slavic national flags."},RW:{endonym:"Rwanda",info:"Three horizontal stripes — light blue (double width), yellow, green — with a 24-rayed yellow sun in the upper fly corner. Adopted in 2001 to move away from the older red-yellow-green tricolor associated with the genocide. Blue is for happiness, yellow for economic development, green for hope."},KN:{endonym:"Saint Kitts and Nevis",info:"A diagonal black band edged with yellow from lower hoist to upper fly, bearing two white five-pointed stars, with a green upper-hoist triangle and a red lower-fly triangle. Green is for fertility, red for the struggle from slavery, black for African heritage, yellow for sunshine, and the stars for hope and liberty."},LC:{endonym:"Saint Lucia",info:"A light blue field with a black isosceles triangle bordered in white and a smaller yellow triangle in front of it, all centered. The triangles represent the iconic twin Pitons rising from the sea. Blue stands for the Caribbean, gold for sunshine, black and white for cultural unity."},VC:{endonym:"Saint Vincent and the Grenadines",info:"Three vertical bands — blue, gold (double width), green — with three green diamonds in a V-pattern on the gold band. Blue stands for the sky and sea, gold for the warmth and sand, green for the lush vegetation. The diamonds form a 'V' for Vincent and represent the islands as 'gems of the Antilles.'"},WS:{endonym:"Sāmoa",info:"A red field with a blue rectangle in the canton bearing five white five-pointed stars representing the Southern Cross constellation. Red is for courage, blue for freedom, and white for purity. The Southern Cross marks Samoa's location in the southern Pacific."},SM:{endonym:"San Marino",info:"Two horizontal stripes — white over light blue — with the coat of arms in the center. White represents the snow of Mount Titano, blue the sky. The arms include three towers on three peaks (the fortresses of Mount Titano), with a crown and the word 'LIBERTAS.'"},ST:{endonym:"São Tomé e Príncipe",info:"Three horizontal stripes — green, yellow (double width), green — with a red triangle at the hoist and two black five-pointed stars on the yellow band. The Pan-African colors; the two stars represent the two islands, and red recalls the struggle for independence."},SA:{endonym:"السعودية (al-Suʿūdiyya)",info:"A green field with the Islamic shahada in white Arabic calligraphy above a horizontal white sword. The shahada — 'There is no god but God, Muhammad is the messenger of God' — makes this one of only a few flags with religious text. The sword represents justice and the dynasty's founder."},SN:{endonym:"Sénégal",info:"Three vertical stripes — green, yellow, red — with a green five-pointed star in the center. The classic Pan-African colors in the French tricolor layout. Green stands for hope and Islam, yellow for natural wealth, red for sacrifice and determination, and the star for unity and openness."},RS:{endonym:"Србија (Srbija)",info:"Three horizontal stripes — red, blue, white — with the coat of arms (a white double-headed eagle on a red shield, with a crown) toward the hoist. The Pan-Slavic colors, in the same order as Russia's flag but inverted; the eagle is a Serbian Orthodox emblem."},SC:{endonym:"Seychelles",info:"Five diagonal bands radiating from the lower hoist corner — blue, yellow, red, white, green. The unique fan design represents a dynamic young country moving into the future. Blue is for sea and sky, yellow for the sun, red for the people and determination, white for justice, green for the land."},SL:{endonym:"Sierra Leone",info:"Three horizontal stripes — green, white, blue. Green represents the country's agriculture, mountains, and natural resources; white stands for unity and justice; blue represents the natural harbor of Freetown and the Atlantic Ocean."},SG:{endonym:"Singapore",info:"Two horizontal stripes — red over white — with a white crescent moon facing a pentagon of five white stars in the upper hoist. Red stands for universal brotherhood, white for purity. The crescent represents a young nation rising; the five stars stand for democracy, peace, progress, justice, and equality."},SK:{endonym:"Slovensko",info:"Three horizontal stripes — white, blue, red — with the Slovak coat of arms (a white double cross on three blue hills, on a red shield) offset toward the hoist. The Pan-Slavic colors; the double cross is an ancient Slovak symbol, the three hills represent Tatra, Fatra, and Mátra mountains."},SI:{endonym:"Slovenija",info:"Three horizontal stripes — white, blue, red — with the Slovenian coat of arms (Mount Triglav with three six-pointed stars and wavy lines for the Adriatic) in the upper hoist. The Pan-Slavic colors; the three stars come from the medieval Counts of Celje."},SB:{endonym:"Solomon Islands",info:"A field divided diagonally from lower hoist to upper fly by a yellow stripe, with a blue upper triangle bearing five white stars and a green lower triangle. Blue stands for water, green for the land, yellow for the sun, and the five stars represent the five original districts."},SO:{endonym:"Soomaaliya / الصومال",info:"A light blue field with a single white five-pointed star in the center. The blue was originally chosen to honor the United Nations, which administered Somalia before independence. The five points of the star represent the five regions where ethnic Somalis traditionally live."},ZA:{endonym:"South Africa",info:"A unique design featuring six colors and a horizontal Y-shape: green bordered in white and yellow, with red above and blue below, and a black triangle at the hoist. The Y represents the convergence of diverse elements into a unified path. Adopted in 1994 after apartheid ended."},KR:{endonym:"대한민국 (Daehan Minguk)",info:"A white field with a central red-and-blue Taegeuk (yin-yang) symbol, surrounded by four black trigrams from the I Ching at the corners. White represents peace and purity; the Taegeuk represents the balance of cosmic forces; the four trigrams symbolize heaven, earth, fire, and water."},SS:{endonym:"South Sudan",info:"Three horizontal stripes — black, red, green — separated by thin white fimbriations, with a blue triangle at the hoist bearing a yellow star. Black represents the people, red the blood shed for freedom, green the land, white peace, blue the Nile waters, and the star unity and hope."},ES:{endonym:"España",info:"Three horizontal stripes — red, yellow (double width), red — with the national coat of arms on the yellow band toward the hoist. The colors come from the heraldic shields of medieval Castile and Aragon. The arms show the pillars of Hercules, symbolizing Spain's reach across the seas."},LK:{endonym:"ශ්‍රී ලංකා (Śrī Laṅkā)",info:"A golden lion holding a sword on a maroon field, with four bo-leaves at the corners, alongside two vertical bands of green and saffron at the hoist. The lion represents the Sinhalese; the green band represents Sri Lankan Moors, the saffron the Tamils. The bo-leaves stand for Buddhist virtues."},SD:{endonym:"السودان (as-Sūdān)",info:"Three horizontal stripes — red, white, black — with a green triangle at the hoist. The four Pan-Arab colors: red for the struggle and martyrs, white for peace and optimism, black for Sudan (the name itself means 'land of the blacks' in Arabic), and green for Islam and prosperity."},SR:{endonym:"Suriname",info:"Five horizontal stripes — green, white, red (double width), white, green — with a yellow five-pointed star in the center of the red band. Green is for the fertile land and hope, white for justice and peace, red for love and progress, and the star for the unity of all ethnic groups and a golden future."},SE:{endonym:"Sverige",info:"A blue field with a yellow Nordic cross offset toward the hoist. The colors come from the Swedish coat of arms — three gold crowns on a blue shield — dating back to the Middle Ages. The Nordic cross format follows the Scandinavian tradition started by Denmark."},CH:{endonym:"Schweiz / Suisse / Svizzera",info:"A red square (one of only two square national flags in the world, along with Vatican City) with a bold white Greek cross in the center. The cross has been a Swiss symbol since the 14th century; red and white come from the medieval Old Swiss Confederacy."},SY:{endonym:"سوريا (Sūriyā)",info:"Three horizontal stripes — red, white, black — with two green five-pointed stars on the white band. The Pan-Arab colors: red for the Hashemites and sacrifice, white for the Umayyads and a bright future, black for the Abbasids and the dark colonial past, and the green stars for the Fatimids and unity."},TW:{endonym:"臺灣 (Táiwān)",info:"A red field with a blue canton bearing a white sun with 12 triangular rays. The 12 rays represent the 12 traditional Chinese hours and months, and the spirit of progress. The flag was originally designed for the Republic of China; blue is for liberty, white for equality, red for fraternity."},TJ:{endonym:"Тоҷикистон (Tojikiston)",info:"Three horizontal stripes — red, white (with central crown and stars), green — with the white double-width. Red stands for unity, white for the country's main export (cotton) and the snow-capped mountains, green for fertile valleys. The seven gold stars above a crown symbolize the seven Tajik virtues."},TZ:{endonym:"Tanzania",info:"A black diagonal band edged in yellow from lower hoist to upper fly, separating a green upper triangle from a blue lower triangle. Green is for agriculture, yellow for mineral wealth, black for the people, and blue for the lakes, rivers, and Indian Ocean."},TH:{endonym:"ประเทศไทย (Prathet Thai)",info:"Five horizontal stripes — red, white, blue (double width), white, red. Known as the 'Thong Trairong' (tricolor flag), it was adopted in 1917. Red represents the land and the people, white the Buddhist faith and purity, and blue the monarchy. Blue is also a tribute to Thailand's WWI Allies."},TL:{endonym:"Timór Lorosa'e",info:"A red field with a yellow isosceles triangle (representing the colonial past) overlaid by a smaller black triangle (representing the dark struggle for independence), with a white five-pointed star in the black triangle. Red is for the struggle, white for peace, and the star is the light of hope."},TG:{endonym:"Togo",info:"Five alternating horizontal stripes (green, yellow, green, yellow, green) with a red square in the upper hoist bearing a white five-pointed star. The Pan-African colors with the white star of hope; the five stripes represent the five administrative regions of the country."},TO:{endonym:"Tonga",info:"A red field with a white rectangle in the canton bearing a red Greek cross. Red represents the blood of Christ shed for humanity, and the cross signifies the deep Christian faith of the Tongan people. White represents purity. The flag has been used since 1875."},TT:{endonym:"Trinidad and Tobago",info:"A red field crossed diagonally from upper hoist to lower fly by a black band edged in white. Red is for the vitality and warmth of the people and the sun, black for dedication and the wealth of the land, and white for the sea, equality, and the purity of aspirations."},TN:{endonym:"تونس (Tūnis)",info:"A red field with a white disc in the center bearing a red crescent enclosing a red five-pointed star. Red is the traditional color of the Ottoman Empire; the crescent and star are Islamic symbols. The design dates back to about 1831 and has changed little since."},TR:{endonym:"Türkiye",info:"A red field with a white crescent and five-pointed star slightly off-center toward the hoist. Red has been a Turkish color for centuries; legend holds the crescent and star reflect the moon and a star seen in a pool of blood after the Battle of Kosovo. Inherited from the Ottoman Empire."},TM:{endonym:"Türkmenistan",info:"A green field with a vertical red stripe near the hoist bearing five traditional carpet guls (medallions) representing the five major Turkmen tribes, above two crossed olive branches; a white crescent and five white stars sit in the upper fly. Green and the crescent represent Islam."},TV:{endonym:"Tuvalu",info:"A light blue field with the Union Jack in the canton and nine yellow five-pointed stars on the fly, arranged to roughly mirror Tuvalu's geographic layout in the Pacific. The stars represent the nine islands; blue is the Pacific Ocean."},UG:{endonym:"Uganda",info:"Six alternating horizontal stripes — black, yellow, red, black, yellow, red — with a white disc in the center bearing a grey crowned crane. Black represents the African people, yellow the sun, and red the African brotherhood. The grey crowned crane is the national symbol."},UA:{endonym:"Україна (Ukrayina)",info:"Two horizontal stripes — blue over yellow. The colors are commonly said to represent the blue sky above and the golden wheat fields below — evoking the agricultural heartland of Ukraine. They trace back to the heraldry of the medieval Kingdom of Galicia–Volhynia."},AE:{endonym:"الإمارات (al-Imārāt)",info:"Three horizontal stripes — green, white, black — with a vertical red band on the hoist side. The four Pan-Arab colors representing the unity of all Arab nations: red for the union, green for fertility, white for neutrality, and black for the defeat of enemies."},GB:{endonym:"United Kingdom",info:"The Union Jack: a combination of the red cross of St. George (England) on white, the white diagonal cross of St. Andrew (Scotland) on blue, and the red diagonal cross of St. Patrick (Ireland). The design dates to 1801, marking the political union of Great Britain and Ireland."},US:{endonym:"United States",info:"13 horizontal stripes (alternating red and white) and a blue canton with 50 white five-pointed stars in nine rows. The stripes represent the 13 original colonies that declared independence; the stars represent the 50 current states. Red stands for valor, white for purity, blue for vigilance and justice."},UY:{endonym:"Uruguay",info:"Nine horizontal stripes alternating white and blue, with a white canton bearing a golden Sun of May with 16 rays alternating wavy and straight. The stripes represent the nine original departments. The sun, shared with Argentina, commemorates the May 1810 revolution."},UZ:{endonym:"Oʻzbekiston",info:"Three horizontal stripes — blue, white (with red fimbriations), green — with a white crescent and twelve white stars in the upper hoist. Blue represents the sky and water (and Tamerlane's banner), white peace, green nature, red the life-force within. The 12 stars stand for the 12 constellations and months."},VU:{endonym:"Vanuatu",info:"A black isosceles triangle at the hoist bearing a yellow boar's tusk encircling two crossed namele fern fronds, with a horizontal yellow Y-shape outlined in black separating a red upper band from a green lower band. The Y reflects the island chain's layout; the tusk and fronds are traditional symbols of prosperity and peace."},VA:{endonym:"Status Civitatis Vaticanae",info:"A square flag (one of only two in the world, alongside Switzerland), with two vertical bands of yellow and white. The white side bears the crossed keys of Saint Peter (one gold, one silver) beneath the papal tiara. Yellow and white are the traditional colors of the papacy."},VE:{endonym:"Venezuela",info:"Three horizontal stripes — yellow, blue, red — with an arc of eight white five-pointed stars on the blue band (one star added in 2006 for Guayana). The colors come from the Gran Colombia tradition shared with Colombia and Ecuador; the stars represent the provinces that signed for independence."},VN:{endonym:"Việt Nam",info:"A red field with a large yellow five-pointed star in the center. Red represents the revolution, bloodshed, and success; the yellow star represents the unity of workers, peasants, intellectuals, traders, and soldiers in building socialism. Adopted in 1955 in North Vietnam and extended after reunification."},YE:{endonym:"اليمن (al-Yaman)",info:"Three horizontal stripes — red, white, black. The three Pan-Arab colors without additional emblems: red for the blood of martyrs and unity, white for a bright future, and black for the dark past. Adopted in 1990 after the unification of North and South Yemen."},ZM:{endonym:"Zambia",info:"A green field with a flag-flying eagle and three vertical stripes (red, black, orange) in the lower fly corner. Green represents the natural resources and vegetation, red the struggle for freedom, black the people, orange the country's copper wealth, and the eagle the ability to rise above national problems."},ZW:{endonym:"Zimbabwe",info:"Seven horizontal stri
